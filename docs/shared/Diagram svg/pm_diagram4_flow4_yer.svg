<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 12px; font-weight: 600; fill: #e8e0d4; }
  .ts { font-size: 10px; font-weight: 400; fill: #b0a898; }
  .arr { stroke: #b0a898; stroke-width: 1; fill: none; }
  .c-teal rect   { fill: #1a3d3a; stroke: #2d7a6e; stroke-width: 1; }
  .c-purple rect { fill: #2d1f3d; stroke: #7c4daa; stroke-width: 1; }
  .c-blue rect   { fill: #1a2a3d; stroke: #2d6aaa; stroke-width: 1; }
  .c-green rect  { fill: #1a3d22; stroke: #2ea84a; stroke-width: 1; }
  .c-gray rect   { fill: #2a2a2a; stroke: #666; stroke-width: 1; }
  .note rect     { fill: #1e1e1e; stroke: #555; stroke-width: 0.5; }
  .offline rect  { fill: #1e1e1e; stroke: #555; stroke-width: 0.5; }
</style>
<rect width="680" height="780" fill="#141414"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b0a898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="ts" x="40" y="22" fill="#666">FLOW 4 — YEAR-END REVIEW (YER)</text>
<line x1="40" y1="26" x2="640" y2="26" stroke="#333" stroke-width="0.5"/>

<g class="c-teal"><rect x="160" y="40" width="360" height="100" rx="8"/></g>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Employee self-assessment</text>
<text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">Rate WHAT · Development · HOW goals</text>
<text class="ts" x="340" y="96" text-anchor="middle" dominant-baseline="central">Per-goal or summary per goal type</text>
<text class="ts" x="340" y="112" text-anchor="middle" dominant-baseline="central">Goals from MYR → can clone content</text>
<text class="ts" x="340" y="128" text-anchor="middle" dominant-baseline="central">Overall performance rating (1–5)</text>

<g class="note"><rect x="40" y="50" width="116" height="44" rx="6"/></g>
<text class="ts" x="98" y="68" text-anchor="middle" dominant-baseline="central" fill="#666">Employee sees:</text>
<text class="ts" x="98" y="84" text-anchor="middle" dominant-baseline="central" fill="#666">own self-assessment</text>

<line x1="340" y1="140" x2="340" y2="160" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="200" y="160" width="280" height="44" rx="8"/></g>
<text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">Submit to LM1</text>
<text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central">LM1 reviews &amp; rates</text>
<line x1="340" y1="204" x2="340" y2="224" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="160" y="224" width="360" height="64" rx="8"/></g>
<text class="th" x="340" y="244" text-anchor="middle" dominant-baseline="central">LM1 rates &amp; submits</text>
<text class="ts" x="340" y="262" text-anchor="middle" dominant-baseline="central">Per-goal or summary · WHAT · Dev · HOW + Overall</text>
<text class="ts" x="340" y="278" text-anchor="middle" dominant-baseline="central">Passes to LM2</text>

<g class="note"><rect x="40" y="234" width="116" height="44" rx="6"/></g>
<text class="ts" x="98" y="250" text-anchor="middle" dominant-baseline="central" fill="#666">Employee sees:</text>
<text class="ts" x="98" y="266" text-anchor="middle" dominant-baseline="central" fill="#666">LM1 per-goal (not overall)</text>

<line x1="340" y1="288" x2="340" y2="308" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="200" y="308" width="280" height="44" rx="8"/></g>
<text class="th" x="340" y="326" text-anchor="middle" dominant-baseline="central">LM2 reviews &amp; rates</text>
<text class="ts" x="340" y="342" text-anchor="middle" dominant-baseline="central">Submits to HOD</text>
<line x1="340" y1="352" x2="340" y2="372" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="160" y="372" width="360" height="56" rx="8"/></g>
<text class="th" x="340" y="392" text-anchor="middle" dominant-baseline="central">HOD reviews &amp; rates</text>
<text class="ts" x="340" y="410" text-anchor="middle" dominant-baseline="central">Rating recorded on system</text>
<text class="ts" x="340" y="426" text-anchor="middle" dominant-baseline="central">(no submission to CEO on system)</text>
<line x1="340" y1="428" x2="340" y2="448" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="160" y="448" width="360" height="56" rx="8"/></g>
<text class="th" x="340" y="468" text-anchor="middle" dominant-baseline="central">Total Rewards exports data (offline)</text>
<text class="ts" x="340" y="486" text-anchor="middle" dominant-baseline="central">Downloads full rating file from system</text>
<text class="ts" x="340" y="502" text-anchor="middle" dominant-baseline="central">Consolidates &amp; presents to CEO for approval</text>
<line x1="340" y1="504" x2="340" y2="524" class="arr" marker-end="url(#arrow)"/>

<g class="offline"><rect x="160" y="524" width="360" height="44" rx="8"/></g>
<text class="th" x="340" y="542" text-anchor="middle" dominant-baseline="central" fill="#b0a898">CEO approves (offline)</text>
<text class="ts" x="340" y="558" text-anchor="middle" dominant-baseline="central" fill="#666">Approval process outside system</text>
<line x1="340" y1="568" x2="340" y2="588" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="160" y="588" width="360" height="56" rx="8"/></g>
<text class="th" x="340" y="608" text-anchor="middle" dominant-baseline="central">Total Rewards uploads final file</text>
<text class="ts" x="340" y="626" text-anchor="middle" dominant-baseline="central">Bulk upload to system</text>
<text class="ts" x="340" y="642" text-anchor="middle" dominant-baseline="central">Final rating recorded for all employees</text>
<line x1="340" y1="644" x2="340" y2="664" class="arr" marker-end="url(#arrow)"/>

<g class="c-green"><rect x="160" y="664" width="360" height="56" rx="8"/></g>
<text class="th" x="340" y="684" text-anchor="middle" dominant-baseline="central">L&amp;OD publishes final rating (YER)</text>
<text class="ts" x="340" y="702" text-anchor="middle" dominant-baseline="central">Clicks Publish button at cycle end</text>
<text class="ts" x="340" y="718" text-anchor="middle" dominant-baseline="central">Employee notified of CEO-approved rating</text>

<g class="note"><rect x="40" y="674" width="116" height="44" rx="6"/></g>
<text class="ts" x="98" y="690" text-anchor="middle" dominant-baseline="central" fill="#666">Employee sees:</text>
<text class="ts" x="98" y="706" text-anchor="middle" dominant-baseline="central" fill="#666">final rating (CEO score)</text>

<line x1="340" y1="720" x2="340" y2="740" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="220" y="740" width="240" height="36" rx="18"/></g>
<text class="th" x="340" y="758" text-anchor="middle" dominant-baseline="central">YER complete · Stored in HRM / PMS</text>
</svg>
