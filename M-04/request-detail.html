<html lang="vi">

<style>
:root{--z50:#fafafa;--z100:#f4f4f5;--z200:#e4e4e7;--z500:#71717a;--z600:#52525b;--z700:#3f3f46;--z900:#18181b;--brand:#a50064;--muted:rgba(165,0,100,.07);--ring:rgba(165,0,100,.2)}*{box-sizing:border-box}body{margin:0;background:var(--z50);font:14px 'Public Sans',sans-serif;color:var(--z700)}button{font:inherit}.topbar{height:52px;background:#fff;border-bottom:1px solid var(--z200);display:flex;align-items:center;padding:0 24px}.page{padding:22px 24px 36px}.breadcrumb{font-size:11.5px;color:var(--z500);margin-bottom:12px}.breadcrumb a{color:inherit;text-decoration:none}.head{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}.goal{font-size:18px;color:var(--z900);margin:0}.meta{font-size:11px;color:var(--z500);margin-top:5px}.btn{border:1px solid var(--z200);background:#fff;border-radius:6px;padding:7px 10px;color:var(--z600);display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:520px;background:#fff;border:1px solid var(--z200);border-radius:9px;overflow:hidden}.rail{background:var(--z50);border-right:1px solid var(--z200)}.rail-title{padding:11px 13px;color:var(--z500);font-size:10px;font-weight:600;text-transform:uppercase}.person{width:100%;border:0;border-top:1px solid var(--z200);background:transparent;padding:11px 13px;display:flex;gap:9px;text-align:left;cursor:pointer}.person.on{background:#fff;box-shadow:inset 3px 0 var(--brand)}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--muted);color:var(--brand);font-size:10px;font-weight:700;flex:none}.identity{font-size:12px;font-weight:600;color:var(--z900)}.domain{font-weight:400;color:var(--z500)}.small{font-size:10px;color:var(--z500);margin-top:3px}.pane-head{padding:14px 16px;border-bottom:1px solid var(--z200);display:flex;justify-content:space-between;gap:14px}.pane-title{font-size:14px;font-weight:700;color:var(--z900)}.pane-body{padding:14px 16px}.shared-question,.question{padding:8px 10px;background:var(--z50);border-left:3px solid var(--ring);margin-bottom:10px}.label{font-size:10px;font-weight:600;color:var(--z500);text-transform:uppercase;margin:13px 0 7px}.question-text{font-size:12px;line-height:1.55;margin-top:3px}.feedback-card{position:relative;border:1px solid var(--z200);border-radius:8px;padding:14px;background:#fff;margin-bottom:9px}.fb-head{display:flex;gap:9px;padding-right:48px}.fb-line{font-size:12.5px;font-weight:600;color:var(--z900)}.fb-arrow{display:inline-block;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid var(--z600);margin:0 8px}.fb-date{font-size:11px;color:var(--z500);margin-top:2px;display:flex;gap:5px}.fb-body{font-size:12.5px;line-height:1.65;margin:10px 0 0}.cv-icons{position:absolute;right:12px;top:12px}.cv-icon{width:26px;height:26px;border-radius:50%;background:var(--muted);display:inline-block}.pending{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--z200)}.ai{margin-top:14px;padding:10px 12px;background:var(--z50);border-radius:6px;color:var(--z500);font-size:11px}.empty{padding:30px;text-align:center;color:var(--z500)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--z900);color:#fff;padding:9px 14px;border-radius:7px;display:none}.toast.show{display:block}@media(max-width:760px){.page{padding:16px}.head{flex-direction:column}.shell{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--z200)}}
/* Keep employee identity and progress as two distinct information rows. */
.person-copy{min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:1px}.person-copy .identity{display:block;line-height:1.35}.person-copy .small{display:block;margin:0;line-height:1.4}
.pms-tooltip{position:relative;display:inline-flex;align-items:center;cursor:help}.pms-tooltip-content{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);z-index:40;padding:5px 9px;background:var(--z900);color:#fff;border-radius:6px;font-size:12px;font-weight:500;line-height:1.4;white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s ease}.pms-tooltip-content::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-bottom-color:var(--z900)}.pms-tooltip:hover .pms-tooltip-content,.pms-tooltip:focus-visible .pms-tooltip-content{opacity:1;visibility:visible}
/* Request detail follows the shared PMS split-view hierarchy. */
:root{--brand-muted:rgba(165,0,100,.07);--brand-ring:rgba(165,0,100,.2);--warning:#9a5b00;--warning-muted:#fff9e8;--warning-border:#f4ce76}
.page{padding:22px 24px 28px}.goal{line-height:1.35;letter-spacing:-.4px}.meta{font-size:12px}.request-detail-layout{grid-template-columns:240px minmax(440px,1fr) 280px;height:calc(100vh - 190px);min-height:520px;max-height:760px}.rail{overflow-y:auto}.content-pane{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--z200)}.pane-head{flex:0 0 auto}.pane-body{padding:14px 16px;overflow-y:auto;min-height:0}.shared-question,.question{background:var(--brand-muted);border-left:3px solid var(--brand-ring);padding:10px 12px}.question .label,.shared-question .label{margin-top:0;color:var(--brand)}.feedback-card{padding:14px 16px}.fb-line{display:flex;align-items:center;flex-wrap:wrap;gap:0}.fb-line .pms-tooltip{margin-right:0}.fb-body{font-size:13.5px;line-height:1.6}.cv-icons{display:flex;gap:3px}.cv-icon{width:28px;height:28px;object-fit:cover;background:transparent}.pending-list{display:flex;flex-direction:column;gap:8px}.pending{padding:11px 12px;background:var(--warning-muted);border:1px solid var(--warning-border);border-radius:7px}.pending .identity{color:var(--z900)}.pending-status{display:inline-flex;align-items:center;gap:5px;color:var(--warning);font-size:11px;font-weight:600;margin-top:4px}.ticket-summary{background:var(--z50);padding:16px;overflow-y:auto}.summary-title{font-size:13px;font-weight:700;color:var(--z900);margin-bottom:14px}.summary-status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--warning-border);border-radius:6px;background:var(--warning-muted);color:var(--warning);font-size:11.5px;font-weight:600}.summary-progress{margin:16px 0}.summary-progress-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--z600);margin-bottom:7px}.summary-progress-head strong{color:var(--z900)}.summary-progress-track{height:6px;border-radius:20px;background:var(--z200);overflow:hidden}.summary-progress-fill{display:block;height:100%;border-radius:inherit;background:var(--brand)}.summary-list{border-top:1px solid var(--z200)}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--z200);font-size:11.5px;color:var(--z500)}.summary-row strong{color:var(--z700);font-weight:500;text-align:right}.summary-ai{margin-top:14px;padding:11px 12px;border:1px solid var(--z200);border-radius:7px;background:#fff}.summary-ai-title{font-size:12px;font-weight:600;color:var(--z800)}.summary-ai-copy{font-size:11px;line-height:1.5;color:var(--z500);margin-top:4px}.ai{display:none}
.employee-badge-summary{display:flex;align-items:center;gap:10px;min-height:28px;margin-top:8px}.employee-badge-item{display:inline-flex;align-items:center;gap:4px;color:var(--z600);font-size:12px}.employee-badge-item img{width:24px;height:24px;border-radius:50%;object-fit:cover}.btn-remind{font-size:11.5px;font-weight:600;box-shadow:0 1px 2px rgba(24,24,27,.08);border-color:var(--z300);height:30px;padding:0 10px;white-space:nowrap;align-self:flex-start}.btn-remind i{font-size:14px;color:var(--z600)}.btn-remind:hover{background:var(--z50);border-color:var(--z500)}.btn-pending-remind{height:28px;padding:0 9px;font-size:11px;white-space:nowrap}.btn-pending-remind i{font-size:13px}
.ai-summary{margin-bottom:14px;border:1px solid var(--z200);border-radius:8px;background:#fff;overflow:hidden}.ai-summary-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--z100)}.ai-summary-brand{display:flex;align-items:center;gap:7px;color:var(--brand);font-size:13px;font-weight:700}.ai-summary-brand i{font-size:17px}.ai-summary-auto{font-size:11px;color:var(--z500);margin-top:3px}.ai-summary-content{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;padding:13px 14px 10px}.ai-summary-section{min-width:0}.ai-summary-section.themes{grid-column:1/-1;border-top:1px solid var(--z100);margin-top:10px;padding-top:10px}.ai-summary-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.35px;color:var(--z600);margin-bottom:6px}.ai-summary-list{margin:0;padding-left:17px;color:var(--z700);font-size:12.5px;line-height:1.55}.ai-summary-list li+li{margin-top:4px}.ai-theme-list{display:flex;flex-wrap:wrap;gap:6px}.ai-theme{padding:4px 8px;border-radius:20px;background:var(--z100);color:var(--z600);font-size:11px}.ai-summary-foot{padding:8px 14px;border-top:1px solid var(--z100);color:var(--z500);font-size:10.5px}.ai-summary-empty{display:flex;align-items:center;gap:9px;padding:13px 14px;color:var(--z500);font-size:12px}.ai-summary-empty i{font-size:18px;color:var(--z400)}
.ai-summary{border-color:var(--brand-ring);box-shadow:0 4px 14px rgba(24,24,27,.07)}.ai-summary-head{align-items:center;background:var(--brand-muted);border-bottom-color:var(--brand-ring)}.ai-summary-head-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.ai-summary-updated{color:var(--z500);font-size:10.5px;white-space:nowrap}.ai-summary-content{padding:14px}.ai-summary-empty{background:#fff}.ai-summary-auto,.ai-summary-section.themes,.ai-summary-foot{display:none}
.ai-summary-actions{display:flex;align-items:center;gap:8px}.ai-summary-toggle{width:28px;height:28px;padding:0;border:1px solid var(--z200);border-radius:6px;background:#fff;color:var(--z600);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.ai-summary-toggle:hover{border-color:var(--z400);background:var(--z50)}.ai-summary-toggle i{font-size:17px}.ai-summary.collapsed .ai-summary-content{display:none}.ai-summary.collapsed .ai-summary-empty{display:none}.ai-summary.collapsed .ai-summary-head{border-bottom:0}
/* Questions keep the shared Feedback visual token; AI uses a neutral surface. */
.shared-question,.question{background:var(--brand-muted);border-left:3px solid var(--brand-ring)}.question .label,.shared-question .label{color:var(--brand)}
.ai-summary{border-color:var(--z200);box-shadow:0 3px 12px rgba(24,24,27,.06)}.ai-summary-head{background:#fff;border-bottom-color:var(--z200);padding-top:10px;padding-bottom:10px}.ai-summary-head-meta{flex-direction:row;align-items:center;gap:8px}
@media(max-width:1100px){.request-detail-layout{grid-template-columns:220px minmax(420px,1fr) 250px}}@media(max-width:900px){.request-detail-layout{height:auto;max-height:none;grid-template-columns:220px minmax(0,1fr)}.ticket-summary{grid-column:1/-1;border-top:1px solid var(--z200)}.content-pane{max-height:650px;border-right:0}}@media(max-width:680px){.request-detail-layout{display:block}.rail{max-height:240px}.content-pane{max-height:none}.pane-body{overflow:visible}.ticket-summary{border-top:1px solid var(--z200)}}
</style>

<body>
<header class="topbar">MoMo Performance - Phản hồi</header>
<main class="page">
  <div class="breadcrumb"><a href="index.html?mode=requests">Phản hồi</a> / Yêu cầu / Chi tiết</div>
  <header class="head"><h1 class="goal" id="requestGoal"></h1><a class="btn" href="index.html?mode=requests"><i class="bx bx-arrow-back"></i> Quay lại</a></header>
  <div class="shell request-detail-layout"><aside class="rail"><div class="rail-title">Nhân viên nhận feedback</div><div id="requestEmployeeRail"></div></aside><section class="content-pane"><header class="pane-head"><div><div class="pane-title" id="employeeTitle"></div><div class="employee-badge-summary" id="employeeBadgeSummary" aria-label="Giá trị được ghi nhận"></div></div><button class="btn btn-remind" id="remindAll" onclick="remindPending()"><i class="bx bx-bell"></i> Nhắc người chưa trả lời</button></header><div class="pane-body"><div id="employeeAiSummary"></div><div id="sharedQuestion"></div><div id="requestResponseFeed"></div><div id="pendingReviewers"></div></div></section><aside class="ticket-summary" id="ticketSummary" aria-label="Tổng quan yêu cầu"></aside></div>
</main><div class="toast" id="toast"></div>
<script src="../assets/employees-data.js"></script><script src="manager-feedback-data.js"></script><script src="manager-ai-summary.js"></script><script src="manager-request-model.js"></script><script src="manager-request-seed.js"></script><script src="manager-request-storage.js"></script>
<script>
const params=new URLSearchParams(location.search),requestId=params.get('request'),cycle=params.get('cycle')||'2026',employees=window.PMS_EMPLOYEES||[],storageKey='pms.managerFeedbackRequests.v1';
const requests=ManagerRequestStorage.load(localStorage,storageKey,()=>ManagerRequestSeed.create(employees)),request=requests.find(item=>item.id===requestId),feedbackStore=ManagerFeedbackData.createStore(employees);const collapsedAiEmployees=new Set();let selectedEmployeeId=null;
function todayDMY(){const now=new Date(),pad=n=>String(n).padStart(2,'0');return `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;}
function org(person){return [person.div,person.dept,person.team,person.pos].filter(Boolean).join(' - ');} // Phòng ban - Team - Vị trí
function identityTooltip(label,meta,className='identity'){return `<span class="${className} pms-tooltip" tabindex="0">${label}<span class="pms-tooltip-content" role="tooltip">${meta}</span></span>`;}
function feedbackForAssignment(assignment,index){const items=feedbackStore.feedbackFor(assignment.employeeId,cycle);return items.find(item=>item.sender.dom===assignment.reviewer.login)||items[index%items.length];}
function responseCard(assignment,item,employee){const sender=employees.find(person=>person.login===assignment.reviewer.login),senderTip=sender?`${sender.name} (${sender.login}) - ${org(sender)}`:`${assignment.reviewer.name} (${assignment.reviewer.login})`,badges=(item?.cv||[]).map(cv=>{const icon=ManagerFeedbackData.coreValueIcon(cv);return icon?`<span class="pms-tooltip" tabindex="0"><img src="../Core value with BG/${icon}" class="cv-icon" alt="${cv}"><span class="pms-tooltip-content" role="tooltip">${cv}</span></span>`:'';}).join(''),senderLabel=`${assignment.reviewer.name}&nbsp;<span class="domain">(${assignment.reviewer.login})</span>`;return `<article class="feedback-card">${badges?`<div class="cv-icons">${badges}</div>`:''}<div class="fb-head"><div class="avatar">${assignment.reviewer.ini||item?.sender.ini||''}</div><div><div class="fb-line">${identityTooltip(senderLabel,senderTip,'identity')}<span class="fb-arrow"></span>${identityTooltip(employee.name,`${employee.name} (${employee.login}) - ${org(employee)}`,'identity')}</div><div class="fb-date">${assignment.repliedAt||item?.date||''} <span class="pms-tooltip" tabindex="0"><i class="bx bx-group"></i><span class="pms-tooltip-content" role="tooltip">Chia sẻ với các cấp quản lý</span></span></div></div></div>${request.questionMode==='individual'?`<div class="question"><div class="label">Câu hỏi</div><div class="question-text">${assignment.question}</div></div>`:''}<p class="fb-body">${item?.body||'Nội dung phản hồi sẽ được đồng bộ từ responseId.'}</p></article>`;}
function renderTicketSummary(stat,rows){const percent=stat.total?Math.round(stat.done/stat.total*100):0,status=stat.done===stat.total?'Hoàn thành':stat.overdue?'Quá hạn':'Đang thu thập',reviewerCount=new Set(request.assignments.map(item=>item.reviewer.login)).size;document.getElementById('ticketSummary').innerHTML=`<div class="summary-title">Tổng quan yêu cầu</div><div class="summary-status"><i class="bx ${status==='Hoàn thành'?'bx-check-circle':status==='Quá hạn'?'bx-error-circle':'bx-loader-circle'}"></i>${status}</div><div class="summary-progress"><div class="summary-progress-head"><span>Tiến độ</span><strong>${stat.done}/${stat.total} đã trả lời</strong></div><div class="summary-progress-track"><span class="summary-progress-fill" style="width:${percent}%"></span></div></div><div class="summary-list"><div class="summary-row"><span>Ngày tạo</span><strong>${request.createdAt}</strong></div><div class="summary-row"><span>Hạn phản hồi</span><strong>${request.due}</strong></div><div class="summary-row"><span>Nhân viên nhận phản hồi</span><strong>${rows.length}</strong></div><div class="summary-row"><span>Nhân viên cho phản hồi</span><strong>${reviewerCount}</strong></div></div>`;}
function employeeBadgeSummary(assignments){const counts={};assignments.filter(item=>item.status==='done').forEach((assignment,index)=>{const feedback=feedbackForAssignment(assignment,index);(feedback?.cv||[]).forEach(value=>counts[value]=(counts[value]||0)+1);});return Object.entries(counts).map(([value,count])=>{const icon=ManagerFeedbackData.coreValueIcon(value);return icon?`<span class="employee-badge-item pms-tooltip" tabindex="0"><img src="../Core value with BG/${icon}" alt="${value}"><span>${count}</span><span class="pms-tooltip-content" role="tooltip">${value}</span></span>`:'';}).join('');}
function renderEmployeeAiSummary(employee,done){const feedback=done.map((assignment,index)=>feedbackForAssignment(assignment,index)).filter(Boolean),summary=ManagerAiSummary.create(employee,feedback),target=document.getElementById('employeeAiSummary'),collapsed=collapsedAiEmployees.has(employee.id),toggle=`<button type="button" class="ai-summary-toggle" onclick="toggleEmployeeAiSummary('${employee.id}')" aria-expanded="${!collapsed}" aria-label="${collapsed?'Mở AI Summary':'Thu gọn AI Summary'}"><i class="bx ${collapsed?'bx-chevron-down':'bx-chevron-up'}"></i></button>`,brand=`<div class="ai-summary-brand"><i class="bx bx-sparkles"></i><span>AI Summary</span></div>`;if(!summary.available){target.innerHTML=`<section class="ai-summary ${collapsed?'collapsed':''}"><div class="ai-summary-head">${brand}<div class="ai-summary-actions">${toggle}</div></div><div class="ai-summary-empty"><i class="bx bx-layer"></i><span>Cần ít nhất 2 phản hồi để tạo AI Summary.</span></div></section>`;return;}const list=items=>`<ul class="ai-summary-list">${items.map(item=>`<li>${item}</li>`).join('')}</ul>`;target.innerHTML=`<section class="ai-summary ${collapsed?'collapsed':''}"><div class="ai-summary-head">${brand}<div class="ai-summary-actions"><span class="ai-summary-updated">Cập nhật: ${summary.updatedAt}</span>${toggle}</div></div><div class="ai-summary-content"><section class="ai-summary-section"><div class="ai-summary-label">Điểm mạnh</div>${list(summary.strengths)}</section><section class="ai-summary-section"><div class="ai-summary-label">Cơ hội phát triển</div>${list(summary.opportunities)}</section></div></section>`;}
function toggleEmployeeAiSummary(employeeId){if(collapsedAiEmployees.has(employeeId))collapsedAiEmployees.delete(employeeId);else collapsedAiEmployees.add(employeeId);render();}
function render(){
  if(!request){document.getElementById('requestResponseFeed').innerHTML='<div class="empty">Không tìm thấy yêu cầu.</div>';return;}
  const stat=ManagerRequestModel.summarize(request,todayDMY()),rows=ManagerRequestModel.byEmployee(request,todayDMY());
  document.title=`${request.goal} | Chi tiết yêu cầu`;
  document.getElementById('requestGoal').textContent=request.goal;
  renderTicketSummary(stat,rows);
  if(!rows.some(row=>row.employeeId===selectedEmployeeId))selectedEmployeeId=rows[0]?.employeeId;
  document.getElementById('requestEmployeeRail').innerHTML=rows.map(row=>{const person=employees.find(item=>item.id===row.employeeId);return `<button class="person ${row.employeeId===selectedEmployeeId?'on':''}" onclick="selectEmployee('${row.employeeId}')"><span class="avatar">${person?.ini||''}</span><span><span class="identity" title="${person?`${person.name} (${person.login}) - ${org(person)}`:row.employeeName}">${person?.name||row.employeeName} <span class="domain">(${person?.login||''})</span></span><span class="small">${row.done}/${row.total} phản hồi đã nhận</span></span></button>`;}).join('');
  const employee=employees.find(item=>item.id===selectedEmployeeId),assignments=request.assignments.filter(item=>item.employeeId===selectedEmployeeId),done=assignments.filter(item=>item.status==='done'),pending=assignments.filter(item=>item.status!=='done');
  document.getElementById('employeeTitle').textContent=`Phản hồi đã nhận của ${employee?.name||''}`;
  document.getElementById('employeeBadgeSummary').innerHTML=employeeBadgeSummary(assignments);
  renderEmployeeAiSummary(employee,done);
  document.getElementById('sharedQuestion').innerHTML=request.questionMode==='shared'?`<div class="shared-question"><div class="label">Câu hỏi</div><div class="question-text">${assignments[0]?.question||request.question}</div></div>`:'';
  document.getElementById('requestResponseFeed').innerHTML=done.length?`<div class="label">Phản hồi đã nhận</div>${done.map((assignment,index)=>responseCard(assignment,feedbackForAssignment(assignment,index),employee)).join('')}`:'';
  document.getElementById('pendingReviewers').innerHTML=pending.length?`<div class="label">Cần phản hồi</div><div class="pending-list">${pending.map(item=>`<div class="pending"><div><div class="identity">${item.reviewer.name}&nbsp;<span class="domain">(${item.reviewer.login})</span></div>${request.questionMode==='individual'?`<div class="question-text">${item.question}</div>`:''}<div class="pending-status"><i class="bx bx-time-five"></i>${item.remindedAt?`Đã nhắc ${item.remindedAt}`:'Chưa trả lời'}</div></div><button class="btn btn-pending-remind" onclick="remindOne('${item.id}')" ${item.remindedAt===todayDMY()?'disabled':''}><i class="bx bx-bell"></i> Nhắc</button></div>`).join('')}</div>`:'';
  document.getElementById('remindAll').style.display=pending.length?'':'none';
}
function selectEmployee(id){selectedEmployeeId=id;render();}function persist(){ManagerRequestStorage.save(localStorage,storageKey,requests);}function notify(text){const box=document.getElementById('toast');box.textContent=text;box.classList.add('show');setTimeout(()=>box.classList.remove('show'),2400);}function remindOne(id){if(ManagerRequestModel.remindAssignment(request,id,todayDMY())){persist();render();notify('Đã gửi nhắc người chưa trả lời.');}}function remindPending(){let count=0;request.assignments.filter(item=>item.employeeId===selectedEmployeeId).forEach(item=>{if(ManagerRequestModel.remindAssignment(request,item.id,todayDMY()))count++;});if(count){persist();render();notify(`Đã nhắc ${count} người chưa trả lời.`);}}
render();
</script>
<script>
function normalizeEmployeeRail(){document.querySelectorAll('#requestEmployeeRail .person').forEach(person=>{const copy=person.children[1],progress=copy?.querySelector('.small'),identity=copy?.querySelector('.identity');if(!copy||!progress)return;copy.classList.add('person-copy');if(identity?.title){const content=document.createElement('span');content.className='pms-tooltip-content';content.setAttribute('role','tooltip');content.textContent=identity.title;identity.removeAttribute('title');identity.classList.add('pms-tooltip');identity.tabIndex=0;identity.appendChild(content);}if(!progress.textContent.startsWith('Đã nhận:')){const match=progress.textContent.match(/(\d+)\/(\d+)/);if(match)progress.textContent=`Đã nhận: ${match[1]}/${match[2]} phản hồi`;}});}
const employeeRail=document.getElementById('requestEmployeeRail');new MutationObserver(normalizeEmployeeRail).observe(employeeRail,{childList:true});normalizeEmployeeRail();
</script></body></html>
