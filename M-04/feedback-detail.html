<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phản hồi đã nhận | MoMo HRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<style>
:root{--z0:#fff;--z50:#fafafa;--z100:#f4f4f5;--z200:#e4e4e7;--z500:#71717a;--z600:#52525b;--z700:#3f3f46;--z900:#18181b;--brand:#a50064;--brand-muted:rgba(165,0,100,.07);--brand-ring:rgba(165,0,100,.2)}*{box-sizing:border-box}body{margin:0;background:var(--z50);font:14px 'Public Sans',sans-serif;color:var(--z700)}.top{height:52px;background:#fff;border-bottom:1px solid var(--z200);display:flex;align-items:center;padding:0 24px;color:var(--z600)}main{max-width:980px;margin:auto;padding:24px}.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--brand-muted);color:var(--brand);font-weight:700}.title{font-size:18px;color:var(--z900);font-weight:700}.count{display:inline-flex;min-width:20px;height:20px;align-items:center;justify-content:center;padding:0 6px;border-radius:20px;background:var(--z100);font-size:10px;color:var(--z600);vertical-align:2px}.meta{font-size:12px;color:var(--z600);margin-top:4px}.cards{display:flex;flex-direction:column;gap:10px}.feedback-card{position:relative;border:1px solid var(--z200);border-radius:8px;padding:14px;background:#fff}.fb-head{display:flex;align-items:flex-start;gap:9px;padding-right:55px}.fb-head .avatar{width:30px;height:30px}.fb-line{font-size:12.5px;font-weight:600;color:var(--z900)}.fb-domain{color:var(--z500);font-weight:400}.fb-arrow{display:inline-block;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid var(--z600);margin:0 8px}.fb-date{font-size:11px;color:var(--z500);margin-top:2px;display:flex;align-items:center;gap:5px}.cv-icons{position:absolute;right:12px;top:12px;display:flex}.cv-icon{width:26px;height:26px;border-radius:50%;margin-left:-6px;border:2px solid #fff}.question{margin:11px 0 8px;border-left:3px solid var(--brand-ring);background:rgba(165,0,100,.025);padding:7px 10px}.question-label{font-size:10px;text-transform:uppercase;color:var(--z500);font-weight:600}.question-text{font-size:12px;margin-top:3px;line-height:1.5}.fb-body{font-size:12.5px;line-height:1.65}.empty{padding:40px;text-align:center;color:var(--z500);background:#fff;border:1px solid var(--z200);border-radius:8px}
</style>
</head><body><header class="top">MoMo Performance - Phản hồi</header><main><div class="head"><div class="avatar" id="avatar"></div><div><div class="title">Phản hồi đã nhận <span class="count" id="count">0</span></div><div class="meta" id="meta"></div></div></div><div class="cards" id="cards"></div></main>
<script src="../assets/employees-data.js"></script><script src="manager-feedback-data.js"></script><script>
const params=new URLSearchParams(location.search),employeeId=params.get('employee'),cycle=params.get('cycle')||'2026';
const employees=window.PMS_EMPLOYEES||[],store=ManagerFeedbackData.createStore(employees),employee=employees.find(item=>item.id===employeeId),items=employee?store.feedbackFor(employee.id,cycle):[];
if(employee){document.title=`Phản hồi đã nhận - ${employee.name}`;document.getElementById('avatar').textContent=employee.ini;document.getElementById('meta').textContent=store.employeeMeta(employee);document.getElementById('count').textContent=items.length;document.getElementById('cards').innerHTML=items.length?items.map(item=>store.feedbackCard(item,employee)).join(''):'<div class="empty">Chưa có phản hồi trong chu kỳ này.</div>';}else{document.getElementById('cards').innerHTML='<div class="empty">Không tìm thấy nhân viên.</div>';}
</script></body></html>
