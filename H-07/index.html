<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Báo cáo phản hồi từ HR | MoMo HRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
<style>
:root{--z0:#fff;--z50:#fafafa;--z100:#f4f4f5;--z200:#e4e4e7;--z300:#d4d4d8;--z400:#a1a1aa;--z500:#71717a;--z600:#52525b;--z700:#3f3f46;--z800:#27272a;--z900:#18181b;--brand:#a50064;--brand-muted:rgba(165,0,100,.07);--brand-ring:rgba(165,0,100,.2);--warning:#9a5b00;--warning-muted:#fff9e8;--warning-border:#f4ce76;--err:#b42318}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:14px}body{font-family:'Public Sans',sans-serif;color:var(--z700);background:var(--z50);min-height:100vh;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--z200);display:flex;align-items:center;padding:0 24px;color:var(--z600);font-size:13px}
.page{padding:22px 24px 28px}.breadcrumb{font-size:11.5px;color:var(--z500);margin-bottom:12px}
.head{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px;align-items:flex-start}.goal{font-size:18px;line-height:1.35;letter-spacing:-.4px;color:var(--z900);margin:0}.head-sub{margin-top:4px;font-size:12px;color:var(--z500)}
.btn{border:1px solid var(--z200);background:#fff;border-radius:6px;padding:7px 12px;color:var(--z700);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer}.btn:hover{background:var(--z50);border-color:var(--z400)}
.shell{position:relative;--rail-w:260px;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:520px;height:calc(100vh - 190px);max-height:760px;background:#fff;border:1px solid var(--z200);border-radius:9px;overflow:hidden}
.rail-resizer{position:absolute;top:0;bottom:0;left:var(--rail-w);width:9px;margin-left:-4px;z-index:10;cursor:col-resize;background:transparent;border:0;padding:0;touch-action:none}.rail-resizer::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);background:transparent;transition:background .12s}.rail-resizer:hover::before,.rail-resizer:focus-visible::before{background:var(--brand)}.rail-resizer:focus{outline:none}
.rail{background:var(--z50);border-right:1px solid var(--z200);overflow-y:auto;overflow-x:hidden}.rail-title{padding:11px 13px;color:var(--z500);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.35px}
.report-item{width:100%;border:0;border-top:1px solid var(--z200);background:transparent;padding:11px 13px;display:flex;gap:9px;text-align:left;cursor:pointer;align-items:flex-start}.report-item:hover{background:#fff}.report-item.on{background:#fff;box-shadow:inset 3px 0 var(--brand)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand-muted);color:var(--brand);font-size:10px;font-weight:700;flex:none}.avatar-report i{font-size:15px}.avatar-anon{background:var(--z100);color:var(--z500)}.avatar-anon i{font-size:16px}.identity-anon{color:var(--z600);font-style:italic;font-weight:600}
.report-item-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}.report-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:600;color:var(--z900);line-height:1.35}.small{font-size:10.5px;color:var(--z500)}
.identity-text{display:block;min-width:0;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.domain{margin-left:4px;font-weight:400;color:var(--z500)}
.content-pane{min-width:0;min-height:0;display:flex;flex-direction:column}.pane-head{padding:13px 16px;border-bottom:1px solid var(--z200);flex:0 0 auto;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.35px;color:var(--z500)}.pane-body{padding:16px 18px;overflow-y:auto;overflow-x:hidden;min-height:0}
.report-goal{font-size:16px;font-weight:700;color:var(--z900);line-height:1.35}
.report-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 15px;font-size:11.5px;color:var(--z500)}.report-meta span{display:inline-flex;align-items:center;gap:5px}.report-meta i{font-size:14px}.report-type{font-weight:600;color:var(--brand)}
.report-recipient{display:flex;align-items:center;gap:10px;margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--z200)}.report-recipient-name{font-size:13px;font-weight:700;color:var(--z900)}.report-recipient-meta{font-size:11px;color:var(--z500);margin-top:2px}
.employee-badge-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}.employee-badge-item{display:inline-flex;align-items:center;gap:4px;color:var(--z600);font-size:12px}.employee-badge-item img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.hr-note{margin:0 0 13px;padding:11px 13px;border:1px solid var(--brand-ring);border-radius:8px;background:var(--brand-muted)}.hr-note-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.35px;color:var(--brand);margin-bottom:5px}.hr-note-body{font-size:12.5px;line-height:1.6;color:var(--z700)}
.label{font-size:10px;font-weight:600;color:var(--z500);text-transform:uppercase;letter-spacing:.35px;margin:13px 0 7px}
.dialog-ai-summary{margin:0 0 12px;border:1px solid var(--z200);border-radius:7px;background:#fff;box-shadow:0 3px 12px rgba(24,24,27,.06);overflow:hidden}.dialog-ai-summary-head{background:#fff;border:0;border-bottom:1px solid var(--z200);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;color:var(--brand);font-weight:600}.dialog-ai-summary-brand{display:flex;align-items:center;gap:6px}.dialog-ai-summary-updated{font-size:10.5px;color:var(--z500);font-weight:400}.dialog-ai-summary-content{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:11px 12px}.dialog-ai-summary-label{font-size:10px;text-transform:uppercase;letter-spacing:.35px;color:var(--z500);font-weight:600;margin-bottom:5px}.dialog-ai-summary-list{margin:0;padding-left:15px}.dialog-ai-summary-list li{font-size:11.5px;line-height:1.55;color:var(--z700);margin-bottom:4px}
.question-evidence-group{padding:0 0 13px;margin:0 0 13px;border-bottom:1px solid var(--z200)}.question-evidence-group:last-of-type{margin-bottom:6px;border-bottom:0}.question-disclosure{border:0;border-radius:7px;background:var(--brand-muted)}.question-disclosure summary{list-style:none;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:8px 10px;cursor:pointer;color:var(--z700)}.question-disclosure summary::-webkit-details-marker{display:none}.question-disclosure summary::after{content:'⌄';font-size:15px;line-height:1.4;color:var(--z500);order:3;flex:none;margin-top:1px}.question-disclosure[open] summary::after{transform:rotate(180deg)}.question-inline{min-width:0;flex:1;font-size:12.5px;line-height:1.45;color:var(--z700)}.question-inline-label{font-weight:600;color:var(--z600)}.question-response-count{margin-left:auto;flex:none;font-size:11px;line-height:1.45;color:var(--z500);white-space:nowrap}
.shared-question{width:100%;background:var(--brand-muted);border-radius:10px;padding:8px 12px;margin-bottom:10px}.question-text{font-size:12.5px;line-height:1.45;margin:0}.question-text .question-inline{display:inline}
.question-response{position:relative;display:flex;gap:9px;padding:10px 3px 9px;border-bottom:1px solid var(--z100)}.question-response:last-child{border-bottom:0}.question-response-main{min-width:0;flex:1}.question-response-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.fb-line{font-size:12.5px;font-weight:600;color:var(--z900);display:flex;align-items:center;flex-wrap:wrap}.fb-date{font-size:11px;color:var(--z500);margin-top:2px}.fb-body{font-size:12.5px;line-height:1.6;color:var(--z700);margin:4px 0 0}.cv-icons{display:flex;gap:3px;flex:none}.cv-icon{width:24px;height:24px;object-fit:cover;border-radius:50%}
.content-note{display:flex;align-items:flex-start;gap:9px;padding:12px 13px;border:1px solid var(--z200);border-radius:8px;background:var(--z50);color:var(--z600);font-size:12px;line-height:1.55}.content-note i{font-size:17px;color:var(--z400);margin-top:1px}
.empty{padding:44px 24px;text-align:center;color:var(--z500);font-size:13px}.empty i{font-size:30px;color:var(--z300);display:block;margin-bottom:9px}
.pms-tooltip{position:relative;display:inline-flex;align-items:center;cursor:help}.pms-tooltip-content{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);z-index:40;padding:5px 9px;background:var(--z900);color:#fff;border-radius:6px;font-size:12px;font-weight:500;line-height:1.4;white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s}.pms-tooltip-content::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--z900)}.pms-tooltip:hover .pms-tooltip-content,.pms-tooltip:focus-visible .pms-tooltip-content{opacity:1;visibility:visible}
@media(max-width:1100px){.rail-resizer{display:none}.shell{grid-template-columns:230px minmax(0,1fr)}}@media(max-width:820px){.shell{grid-template-columns:1fr;height:auto;max-height:none}.rail{max-height:210px;border-right:0;border-bottom:1px solid var(--z200)}.rail-resizer{display:none}.dialog-ai-summary-content{grid-template-columns:1fr}.head{flex-direction:column}}
</style>
</head>
<body>
<header class="topbar">MoMo HRM · Performance Management</header>
<main class="page">
  <div class="breadcrumb">Phản hồi › Báo cáo phản hồi từ HR</div>
  <div class="head">
    <div><h1 class="goal">Báo cáo phản hồi từ HR</h1><div class="head-sub" id="headSub"></div></div>
    <button class="btn" onclick="goBack()"><i class="bx bx-arrow-back"></i> Quay lại</button>
  </div>
  <div class="shell" id="shell">
    <aside class="rail"><div class="rail-title" id="railTitle"></div><div id="reportList"></div></aside>
    <div class="rail-resizer" id="railResizer" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Kéo để đổi độ rộng cột"></div>
    <section class="content-pane"><header class="pane-head">Chi tiết báo cáo</header><div class="pane-body" id="reportBody"></div></section>
  </div>
</main>
<script src="../assets/employees-data.js"></script>
<script src="../H-05/feedback-program-data.js"></script>
<script src="../H-05/feedback-program-model.js"></script>
<script src="../H-05/feedback-report-view.js"></script>
<script>
const PARAMS=new URLSearchParams(location.search);
const ME=PARAMS.get('me')||'tu.nguyen';
const ENTRIES=FeedbackReportView.entriesFor(ME);
let SELECTED=0;
function goBack(){if(history.length>1)history.back();else location.href='../E-04/index.html';}
function railLabel(entry){const anon=entry.program.identityVisibility==='anonymous';return `<span class="avatar avatar-report"><i class="bx bx-file"></i></span><span class="report-item-info"><span class="report-name">${entry.program.goal}</span><span class="small">Chia sẻ ${entry.sharing.sharedAt||''} · ${anon?'Ẩn danh':'Ghi danh'}</span></span>`;}
function renderList(){document.getElementById('railTitle').textContent=`Báo cáo (${ENTRIES.length})`;document.getElementById('reportList').innerHTML=ENTRIES.map((entry,index)=>`<button class="report-item${index===SELECTED?' on':''}" onclick="selectReport(${index})">${railLabel(entry)}</button>`).join('');}
function selectReport(index){SELECTED=index;renderList();renderDetail();}
function renderDetail(){const body=document.getElementById('reportBody');const entry=ENTRIES[SELECTED];if(!entry){body.innerHTML='<div class="empty"><i class="bx bx-file-blank"></i>Chưa có báo cáo phản hồi nào được HR chia sẻ cho bạn.</div>';return;}body.innerHTML=FeedbackReportView.detailHTML(entry,{base:'../'});}
function render(){document.getElementById('headSub').textContent=ENTRIES.length?`${ENTRIES.length} báo cáo đã được HR chia sẻ`:'';renderList();renderDetail();}
render();
(function(){const shell=document.getElementById('shell'),handle=document.getElementById('railResizer');if(!shell||!handle)return;const MIN=200,MAX=380,KEY='uc5_h07_rail_w';const clamp=v=>Math.min(MAX,Math.max(MIN,v));const curW=()=>parseInt(getComputedStyle(shell).getPropertyValue('--rail-w'),10)||MIN;const setW=w=>shell.style.setProperty('--rail-w',clamp(w)+'px');const saved=parseInt(localStorage.getItem(KEY),10);if(saved>=MIN&&saved<=MAX)setW(saved);let startX=0,startW=0,dragging=false;handle.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startW=curW();try{handle.setPointerCapture(e.pointerId)}catch(_){}document.body.style.userSelect='none';e.preventDefault();});handle.addEventListener('pointermove',e=>{if(dragging)setW(startW+(e.clientX-startX));});const end=e=>{if(!dragging)return;dragging=false;document.body.style.userSelect='';localStorage.setItem(KEY,curW());try{handle.releasePointerCapture(e.pointerId)}catch(_){}};handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);handle.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){setW(curW()-12);localStorage.setItem(KEY,curW());e.preventDefault();}else if(e.key==='ArrowRight'){setW(curW()+12);localStorage.setItem(KEY,curW());e.preventDefault();}});})();
</script>
</body>
</html>
