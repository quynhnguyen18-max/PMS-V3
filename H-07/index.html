<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Báo cáo phản hồi | MoMo HRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
<style>
:root{--z0:#fff;--z50:#fafafa;--z100:#f4f4f5;--z200:#e4e4e7;--z300:#d4d4d8;--z400:#a1a1aa;--z500:#71717a;--z600:#52525b;--z700:#3f3f46;--z800:#27272a;--z900:#18181b;--brand:#a50064;--brand-muted:rgba(165,0,100,.07);--brand-ring:rgba(165,0,100,.2);--warning:#9a5b00;--warning-muted:#fff9e8;--warning-border:#f4ce76;--err:#b42318;--err-bg:#fff3f3;--err-bd:#f0b8b8}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:14px}body{font-family:'Public Sans',sans-serif;color:var(--z700);background:var(--z50);min-height:100vh;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--z200);display:flex;align-items:center;padding:0 24px;color:var(--z600);font-size:13px}
.page{padding:22px 24px 28px}.breadcrumb{font-size:11.5px;color:var(--z500);margin-bottom:12px}.breadcrumb a{color:inherit}.head{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px;align-items:flex-start}.goal{font-size:18px;line-height:1.35;letter-spacing:-.4px;color:var(--z900);margin:0}.head-sub{margin-top:4px;font-size:12px;color:var(--z500)}.head-actions{display:flex;align-items:center;gap:10px;flex:none}
.btn{border:1px solid var(--z200);background:#fff;border-radius:6px;padding:7px 10px;color:var(--z600);display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer}.btn-outline{background:#fff;border-color:var(--z200);color:var(--z700)}.btn-outline:hover{background:var(--z50);border-color:var(--z400)}
.role-toggle{display:inline-flex;padding:3px;border:1px solid var(--z200);border-radius:8px;background:var(--z100);gap:3px}.role-toggle button{height:28px;padding:0 12px;border:0;border-radius:5px;background:transparent;color:var(--z600);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}.role-toggle button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(24,24,27,.08)}
.persona-hint{margin-bottom:12px;padding:8px 11px;border:1px dashed var(--z300);border-radius:7px;background:var(--z50);color:var(--z500);font-size:11.5px;display:flex;align-items:center;gap:7px}.persona-hint i{font-size:15px;color:var(--z400)}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:520px;background:#fff;border:1px solid var(--z200);border-radius:9px;overflow:hidden}.shell.solo{grid-template-columns:minmax(0,1fr)}
.rail{background:var(--z50);border-right:1px solid var(--z200);overflow-y:auto;overflow-x:hidden}.shell.solo .rail{display:none}.rail-title{padding:11px 13px;color:var(--z500);font-size:10px;font-weight:600;text-transform:uppercase}
.person{width:100%;border:0;border-top:1px solid var(--z200);background:transparent;padding:11px 13px;display:flex;gap:9px;text-align:left;cursor:pointer}.person:hover{background:#fff}.person.on{background:#fff;box-shadow:inset 3px 0 var(--brand)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand-muted);color:var(--brand);font-size:10px;font-weight:700;flex:none}.avatar-anon{background:var(--z100);color:var(--z500)}.avatar-anon i{font-size:16px}.identity-anon{color:var(--z600);font-style:italic;font-weight:600}.avatar-report{background:var(--brand-muted);color:var(--brand)}.avatar-report i{font-size:15px}
.person-info{min-width:0;flex:1;display:flex;flex-direction:column}.identity-text{display:block;min-width:0;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;font-weight:600;color:var(--z900)}.domain{margin-left:4px;font-weight:400;color:var(--z500)}.small{display:block;font-size:10px;color:var(--z500);margin-top:3px}
.content-pane{min-width:0;min-height:0;display:flex;flex-direction:column}.pane-head{padding:14px 16px;border-bottom:1px solid var(--z200);flex:0 0 auto}.pane-title{font-size:15px;font-weight:700;color:var(--z900)}.pane-sub{margin-top:3px;font-size:11.5px;color:var(--z500)}
.employee-badge-summary{display:flex;align-items:center;gap:10px;min-height:22px;margin-top:9px;flex-wrap:wrap}.employee-badge-item{display:inline-flex;align-items:center;gap:4px;color:var(--z600);font-size:12px}.employee-badge-item img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.pane-body{padding:14px 16px;overflow-y:auto;overflow-x:hidden;min-height:0}
.hr-note{margin:0 0 13px;padding:11px 13px;border:1px solid var(--brand-ring);border-radius:8px;background:var(--brand-muted)}.hr-note-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.35px;color:var(--brand);margin-bottom:5px}.hr-note-body{font-size:12.5px;line-height:1.6;color:var(--z700)}
.label{font-size:10px;font-weight:600;color:var(--z500);text-transform:uppercase;letter-spacing:.35px;margin:13px 0 7px}
.dialog-ai-summary{margin:0 0 12px;border:1px solid var(--z200);border-radius:7px;background:#fff;box-shadow:0 3px 12px rgba(24,24,27,.06);overflow:hidden}.dialog-ai-summary-head{background:#fff;border:0;border-bottom:1px solid var(--z200);border-radius:7px 7px 0 0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;width:100%;color:var(--brand);text-align:left;font-weight:600}.dialog-ai-summary-brand{display:flex;align-items:center;gap:6px}.dialog-ai-summary-updated{font-size:10.5px;color:var(--z500);font-weight:400}.dialog-ai-summary-content{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:11px 12px}.dialog-ai-summary-label{font-size:10px;text-transform:uppercase;letter-spacing:.35px;color:var(--z500);font-weight:600;margin-bottom:5px}.dialog-ai-summary-list{margin:0;padding-left:15px}.dialog-ai-summary-list li{font-size:11.5px;line-height:1.55;color:var(--z700);margin-bottom:4px}
.question-evidence-group{padding:0 0 13px;margin:0 0 13px;border-bottom:1px solid var(--z200)}.question-evidence-group:last-of-type{margin-bottom:10px;border-bottom:0}.question-disclosure{border:0;border-radius:7px;background:var(--brand-muted)}.question-disclosure summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;padding:8px 10px;cursor:pointer;color:var(--z700)}.question-disclosure summary::-webkit-details-marker{display:none}.question-disclosure summary::after{content:'⌄';font-size:15px;color:var(--z500);line-height:1;order:3}.question-disclosure[open] summary::after{transform:rotate(180deg)}.question-disclosure-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.35px;color:var(--z500)}.question-response-count{margin-left:auto;font-size:11px;color:var(--z500);white-space:nowrap}.question-wording{padding:0 10px 9px;font-size:12px;line-height:1.5;color:var(--z700)}.question-answers{margin-top:3px}
.shared-question{width:100%;background:var(--brand-muted);border:0;border-radius:10px;padding:7px 12px 8px;margin-bottom:10px}.shared-question .label{margin:0 0 2px;color:var(--z500)}.question-text{font-size:12.5px;line-height:1.5;margin:0}
.question-response{position:relative;display:flex;gap:9px;padding:10px 3px 9px;border-bottom:1px solid var(--z100)}.question-response:last-child{border-bottom:0}.question-response-main{min-width:0;flex:1}.question-response-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.fb-line{font-size:12.5px;font-weight:600;color:var(--z900);display:flex;align-items:center;flex-wrap:wrap}.fb-date{font-size:11px;color:var(--z500);margin-top:2px}.fb-body{font-size:12.5px;line-height:1.6;color:var(--z700);margin:4px 0 0}.question-response .cv-icons{position:static;display:flex;gap:3px;flex:none}.cv-icon{width:24px;height:24px;object-fit:cover;border-radius:50%}
.content-note{display:flex;align-items:flex-start;gap:9px;padding:12px 13px;border:1px solid var(--z200);border-radius:8px;background:var(--z50);color:var(--z600);font-size:12px;line-height:1.55}.content-note i{font-size:17px;color:var(--z400);margin-top:1px}
.blocked{padding:40px 24px;text-align:center;color:var(--z500)}.blocked i{font-size:34px;color:var(--z300);display:block;margin-bottom:10px}.blocked-title{font-size:14px;font-weight:600;color:var(--z700);margin-bottom:5px}.blocked-copy{font-size:12.5px;line-height:1.6;max-width:360px;margin:0 auto}
.empty{padding:40px 24px;text-align:center;color:var(--z500);font-size:13px}
.pms-tooltip{position:relative;display:inline-flex;align-items:center;cursor:help}.pms-tooltip-content{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);z-index:40;padding:5px 9px;background:var(--z900);color:#fff;border-radius:6px;font-size:12px;font-weight:500;line-height:1.4;white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s}.pms-tooltip-content::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--z900)}.pms-tooltip:hover .pms-tooltip-content,.pms-tooltip:focus-visible .pms-tooltip-content{opacity:1;visibility:visible}
@media(max-width:820px){.shell{grid-template-columns:1fr}.rail{max-height:220px;border-right:0;border-bottom:1px solid var(--z200)}.dialog-ai-summary-content{grid-template-columns:1fr}.head{flex-direction:column}}
</style>
</head>
<body>
<header class="topbar">MoMo HRM · Performance Management</header>
<main class="page">
  <div class="breadcrumb"><a href="../H-05/index.html">Phản hồi</a> › Báo cáo kết quả</div>
  <div class="head">
    <div><h1 class="goal" id="goal"></h1><div class="head-sub" id="headSub"></div></div>
    <div class="head-actions">
      <div class="role-toggle" role="tablist" aria-label="Xem với vai trò">
        <button id="roleManager" onclick="setRole('manager')"><i class="bx bx-user-voice"></i> Quản lý</button>
        <button id="roleEmployee" onclick="setRole('employee')"><i class="bx bx-user"></i> Nhân viên</button>
      </div>
    </div>
  </div>
  <div class="persona-hint"><i class="bx bx-info-circle"></i><span id="personaHint"></span></div>
  <div class="shell" id="shell">
    <aside class="rail"><div class="rail-title" id="railTitle"></div><div id="reportList"></div></aside>
    <section class="content-pane"><header class="pane-head"><div class="pane-title" id="reportTitle"></div><div class="pane-sub" id="reportSub"></div><div class="employee-badge-summary" id="reportBadges"></div></header><div class="pane-body" id="reportBody"></div></section>
  </div>
</main>
<script src="../assets/employees-data.js"></script>
<script src="../H-05/feedback-program-data.js"></script>
<script src="../H-05/feedback-program-model.js"></script>
<script>
const BADGE_ICON={teamwork:'Teamwork.png',customer:'Customer_.png',excellence:'Excellence.png',innovation:'Innovation.png',learning:'Constant_.png'};
const BADGE_LABEL={teamwork:'Tinh thần đồng đội',customer:'Khách hàng là trung tâm',excellence:'Thực thi xuất sắc',innovation:'Đổi mới',learning:'Không ngừng học hỏi'};
const PARAMS=new URLSearchParams(location.search);
const EMP_PERSONA=PARAMS.get('me')||'duc.pham';
const MGR_TEAM=['lan.hoang','mai.tran','duc.pham','linh.vu','hung.do'];
const PROGRAM_FILTER=PARAMS.get('id')||'';
let ROLE=PARAMS.get('role')==='manager'?'manager':(PARAMS.get('role')==='employee'?'employee':(PROGRAM_FILTER?'manager':'employee'));
let SELECTED=null,SELECTED_KEY='';
function buildEntries(){return FeedbackProgramData.seedPrograms().flatMap(raw=>{const program=FeedbackProgramModel.normalizeCampaign(raw);const sharing=program.resultSharing||{mode:'not_shared'};if(sharing.mode==='not_shared')return [];if(PROGRAM_FILTER&&program.id!==PROGRAM_FILTER)return [];const detail=FeedbackProgramData.detailForProgram(raw);return detail.participants.filter(item=>FeedbackProgramModel.participantProgress(item).done>=1).filter(item=>sharing.mode==='shared_all'||(sharing.participantIds||[]).includes(item.employee.id)).map(participant=>({program,sharing,detail,participant}));});}
const ENTRIES=buildEntries();
function entryKey(entry){return `${entry.program.id}:${entry.participant.employee.id}`;}
function currentList(){if(ROLE==='employee')return ENTRIES.filter(entry=>entry.participant.employee.id===EMP_PERSONA&&entry.sharing.audience!=='managers_only');return ENTRIES.filter(entry=>MGR_TEAM.includes(entry.participant.employee.id));}
function initials(person){return person.initials||String(person.name||'').split(' ').map(item=>item[0]).join('').slice(0,2);}
function personTooltip(person){return [person.department,person.team,person.position].filter(Boolean).join(' - ');}
function isAnon(){return Boolean(SELECTED)&&SELECTED.program.identityVisibility==='anonymous';}
function showsDetail(){return Boolean(SELECTED)&&SELECTED.sharing.contentLevel!=='summary';}
function contentBadge(sharing){return sharing.contentLevel==='summary'?'Chỉ tổng hợp AI':'Tổng hợp AI kèm chi tiết';}
function reviewerAvatar(reviewer){return isAnon()?`<div class="avatar avatar-anon" aria-hidden="true"><i class="bx bx-user"></i></div>`:`<div class="avatar">${initials(reviewer)}</div>`;}
function reviewerIdentity(reviewer){return isAnon()?`<span class="identity-text identity-anon">Ẩn danh</span>`:`<span class="pms-tooltip" tabindex="0"><span class="identity-text">${reviewer.name}<span class="domain">(${reviewer.domain})</span></span><span class="pms-tooltip-content">${personTooltip(reviewer)}</span></span>`;}
function responseBadges(assignment){return (assignment.badges||[]).map(id=>`<span class="pms-tooltip"><img class="cv-icon" src="../Core value with BG/${BADGE_ICON[id]||'Constant_.png'}" alt=""/><span class="pms-tooltip-content">${BADGE_LABEL[id]||id}</span></span>`).join('');}
function badgeSummary(participant){const tally=FeedbackProgramModel.coreValueTally(participant);return Object.entries(tally).map(([id,count])=>`<span class="employee-badge-item pms-tooltip" tabindex="0"><img src="../Core value with BG/${BADGE_ICON[id]||'Constant_.png'}" alt=""/><span>${count}</span><span class="pms-tooltip-content">${BADGE_LABEL[id]||id}</span></span>`).join('');}
function groupAnswersByQuestion(participant){return (SELECTED.detail.questions||[]).map(question=>({question,answers:(participant.assignments||[]).filter(item=>item.status==='submitted').map(assignment=>({assignment,answer:(assignment.answers||[]).find(item=>item.questionId===question.id)})).filter(item=>item.answer&&item.answer.body)}));}
function questionAnswerRecord(item){const reviewer=item.assignment.reviewer;return `<article class="question-response">${reviewerAvatar(reviewer)}<div class="question-response-main"><div class="question-response-head"><div><div class="fb-line">${reviewerIdentity(reviewer)}</div><div class="fb-date">${item.assignment.submittedAt}</div></div>${item.assignment.badges&&item.assignment.badges.length?`<div class="cv-icons">${responseBadges(item.assignment)}</div>`:''}</div><p class="fb-body">${item.answer.body}</p></div></article>`;}
function questionEvidenceGroup(group,index,single){const count=group.answers.length,head=single?`<div class="shared-question"><div class="label">Câu hỏi</div><p class="question-text">${group.question.text}</p></div>`:`<details class="question-disclosure" open><summary><span class="question-disclosure-label">Câu ${index+1}</span><span class="question-response-count">${count} phản hồi</span></summary><p class="question-wording">${group.question.text}</p></details>`;const body=count?group.answers.map(questionAnswerRecord).join(''):`<div class="content-note"><i class="bx bx-message-square-dots"></i>Chưa có phản hồi cho câu hỏi này.</div>`;return `<section class="question-evidence-group">${head}<div class="question-answers">${body}</div></section>`;}
function aiSummaryBlock(participant){if(!(FeedbackProgramModel.isAiSummaryEligible(participant)&&participant.aiSummary))return '';const list=items=>`<ul class="dialog-ai-summary-list">${items.map(item=>`<li>${item}</li>`).join('')}</ul>`;return `<section class="dialog-ai-summary"><div class="dialog-ai-summary-head"><div class="dialog-ai-summary-brand"><i class="bx bx-sparkles"></i><span>AI Summary</span></div><span class="dialog-ai-summary-updated">Tổng hợp từ ${FeedbackProgramModel.participantProgress(participant).done} phản hồi</span></div><div class="dialog-ai-summary-content"><section><div class="dialog-ai-summary-label">Điểm mạnh</div>${list(participant.aiSummary.strengths)}</section><section><div class="dialog-ai-summary-label">Cơ hội phát triển</div>${list(participant.aiSummary.opportunities)}</section></div></section>`;}
function escapeHTML(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function reportBodyHTML(){const participant=SELECTED.participant;const note=SELECTED.sharing.note?`<div class="hr-note"><div class="hr-note-label"><i class="bx bx-message-rounded-detail"></i>Lời nhắn từ HR</div><div class="hr-note-body">${escapeHTML(SELECTED.sharing.note)}</div></div>`:'';const ai=aiSummaryBlock(participant);let detail='';if(showsDetail()){const groups=groupAnswersByQuestion(participant),single=(SELECTED.detail.questions||[]).length===1;detail=`<div class="label">Phản hồi chi tiết</div>${groups.map((group,index)=>questionEvidenceGroup(group,index,single)).join('')}`;}else{detail=`<div class="content-note"><i class="bx bx-lock-alt"></i>HR chỉ chia sẻ phần tổng hợp (AI Summary). Nội dung phản hồi chi tiết không được hiển thị.</div>`;}return note+ai+detail;}
function renderList(){const list=currentList();document.getElementById('railTitle').textContent=ROLE==='employee'?`Báo cáo của tôi (${list.length})`:`Báo cáo nhân viên (${list.length})`;document.getElementById('reportList').innerHTML=list.map(entry=>{const on=entryKey(entry)===SELECTED_KEY,anon=entry.program.identityVisibility==='anonymous';if(ROLE==='employee'){return `<button class="person${on?' on':''}" onclick="selectEntry('${entryKey(entry)}')"><span class="avatar avatar-report"><i class="bx bx-bar-chart-alt-2"></i></span><span class="person-info"><span class="identity-text">${entry.program.goal}</span><span class="small">Chia sẻ ${entry.sharing.sharedAt||''} - ${anon?'Ẩn danh':'Ghi danh'}</span></span></button>`;}const person=entry.participant.employee;return `<button class="person${on?' on':''}" onclick="selectEntry('${entryKey(entry)}')"><span class="avatar">${initials(person)}</span><span class="person-info"><span class="identity-text">${person.name}<span class="domain">(${person.domain})</span></span><span class="small">${entry.program.goal}</span></span></button>`;}).join('');}
function selectEntry(key){const list=currentList();SELECTED=list.find(entry=>entryKey(entry)===key)||list[0]||null;SELECTED_KEY=SELECTED?entryKey(SELECTED):'';renderList();renderDetail();}
function renderDetail(){const title=document.getElementById('reportTitle'),sub=document.getElementById('reportSub'),badges=document.getElementById('reportBadges'),body=document.getElementById('reportBody');if(!SELECTED){title.textContent='Chưa có báo cáo';sub.textContent='';badges.innerHTML='';body.innerHTML='<div class="empty">Chưa có báo cáo phản hồi nào được chia sẻ cho bạn.</div>';return;}const participant=SELECTED.participant;title.textContent=`Kết quả phản hồi của ${participant.employee.name}`;sub.textContent=`${SELECTED.program.goal} - Chia sẻ ${SELECTED.sharing.sharedAt||''} - ${contentBadge(SELECTED.sharing)}`;badges.innerHTML=badgeSummary(participant);body.innerHTML=reportBodyHTML();}
function setRole(role){ROLE=role;SELECTED=null;SELECTED_KEY='';render();}
function render(){document.getElementById('goal').textContent='Báo cáo phản hồi';document.getElementById('roleManager').classList.toggle('on',ROLE==='manager');document.getElementById('roleEmployee').classList.toggle('on',ROLE==='employee');document.getElementById('personaHint').textContent=ROLE==='manager'?'Đang xem với vai trò Quản lý — danh sách báo cáo của các nhân viên bạn phụ trách.':'Đang xem với vai trò Nhân viên — các báo cáo phản hồi HR đã chia sẻ cho bạn.';const list=currentList();document.getElementById('headSub').textContent=`${list.length} báo cáo`;if(!SELECTED||!list.some(entry=>entryKey(entry)===SELECTED_KEY)){SELECTED=list[0]||null;SELECTED_KEY=SELECTED?entryKey(SELECTED):'';}renderList();renderDetail();}
render();
</script>
</body>
</html>
