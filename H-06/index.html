<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chi tiết chương trình phản hồi | MoMo HRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
<style>
.question-evidence-group{padding:0 0 13px;margin:0 0 13px;border-bottom:1px solid var(--z200)}.question-evidence-group:last-of-type{margin-bottom:10px}.question-disclosure{border:0;border-radius:7px;background:var(--z50)}.question-disclosure summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;padding:8px 10px;cursor:pointer;color:var(--z700)}.question-disclosure summary::-webkit-details-marker{display:none}.question-disclosure summary::after{content:'⌄';font-size:15px;color:var(--z500);line-height:1;order:3}.question-disclosure[open] summary::after{transform:rotate(180deg)}.question-disclosure-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.35px;color:var(--z500)}.question-response-count{margin-left:auto;font-size:11px;color:var(--z500);white-space:nowrap}.question-wording{padding:0 10px 9px;font-size:12px;line-height:1.5;color:var(--z700)}.question-answers{margin-top:3px}.question-response{position:relative;display:flex;gap:9px;padding:10px 3px 9px;border-bottom:1px solid var(--z100)}.question-response:last-child{border-bottom:0}.question-response-main{min-width:0;flex:1}.question-response-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.question-response .fb-body{margin:4px 0 0;font-size:12.5px;line-height:1.6}.question-response .cv-icons{position:static;display:flex;gap:3px;flex:none}.question-response .cv-icon{width:24px;height:24px}.question-empty{padding:10px 3px 2px;font-size:12px;color:var(--z500)}
:root{--z0:#fff;--z50:#fafafa;--z100:#f4f4f5;--z200:#e4e4e7;--z300:#d4d4d8;--z400:#a1a1aa;--z500:#71717a;--z600:#52525b;--z700:#3f3f46;--z800:#27272a;--z900:#18181b;--brand:#a50064;--brand-muted:rgba(165,0,100,.07);--brand-ring:rgba(165,0,100,.2);--warning:#9a5b00;--warning-muted:#fff9e8;--warning-border:#f4ce76;--err:#b42318;--err-bg:#fff3f3;--err-bd:#f0b8b8}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:14px}body{font-family:'Public Sans',sans-serif;color:var(--z700);background:var(--z50);min-height:100vh;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--z200);display:flex;align-items:center;padding:0 24px;color:var(--z600);font-size:13px}
.page{padding:22px 24px 28px}.breadcrumb{font-size:11.5px;color:var(--z500);margin-bottom:12px}.breadcrumb a{color:inherit}.head{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}.goal{font-size:18px;line-height:1.35;letter-spacing:-.4px;color:var(--z900);margin:0}.head-actions{display:flex;align-items:flex-start;gap:8px;flex:none}.btn{border:1px solid var(--z200);background:#fff;border-radius:6px;padding:7px 10px;color:var(--z600);display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer}.btn-outline{background:#fff;border-color:var(--z200);color:var(--z700)}.btn-outline:hover{background:var(--z50);border-color:var(--z400)}.btn-remind{height:30px;padding:0 10px;font-size:11.5px;font-weight:600;box-shadow:0 1px 2px rgba(24,24,27,.08);white-space:nowrap}.btn-remind i{font-size:14px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:520px;background:#fff;border:1px solid var(--z200);border-radius:9px;overflow:hidden}.request-detail-layout{grid-template-columns:240px minmax(440px,1fr) 280px;height:calc(100vh - 190px);min-height:520px;max-height:760px}.rail{background:var(--z50);border-right:1px solid var(--z200);overflow-y:auto;overflow-x:hidden}.rail-title{padding:11px 13px;color:var(--z500);font-size:10px;font-weight:600;text-transform:uppercase}.person{width:100%;border:0;border-top:1px solid var(--z200);background:transparent;padding:11px 13px;display:flex;gap:9px;text-align:left;cursor:pointer}.person:hover{background:#fff}.person.on{background:#fff;box-shadow:inset 3px 0 var(--brand)}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand-muted);color:var(--brand);font-size:10px;font-weight:700;flex:none}.person-info{min-width:0;flex:1}.identity{font-size:12px;font-weight:600;color:var(--z900)}.domain{margin-left:4px;font-weight:400;color:var(--z500)}.small{display:block;font-size:10px;color:var(--z500);margin-top:3px}
.content-pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--z200)}.pane-head{padding:14px 16px;border-bottom:1px solid var(--z200);display:flex;justify-content:space-between;gap:14px;flex:0 0 auto}.pane-title{font-size:14px;font-weight:700;color:var(--z900)}.pane-body{padding:14px 16px;overflow-y:auto;overflow-x:hidden;min-height:0}.employee-badge-summary{display:flex;align-items:center;gap:10px;min-height:28px;margin-top:8px}.employee-badge-item{display:inline-flex;align-items:center;gap:4px;color:var(--z600);font-size:12px}.employee-badge-item img{width:24px;height:24px;border-radius:50%;object-fit:cover}.shared-question{width:100%;background:var(--brand-muted);border:0;border-radius:10px;padding:7px 12px 8px;margin-bottom:10px}.shared-question .label{margin:0 0 2px;color:var(--z500);line-height:1.3;letter-spacing:.35px}.question-text{font-size:12.5px;line-height:1.5;margin:0}.label{font-size:10px;font-weight:600;color:var(--z500);text-transform:uppercase;letter-spacing:.35px}
.dialog-ai-summary{margin:0 0 12px;border:1px solid var(--z200);border-radius:7px;background:#fff;box-shadow:0 3px 12px rgba(24,24,27,.06);overflow:hidden}.dialog-ai-summary-head{background:#fff;border:0;border-bottom:1px solid var(--z200);border-radius:7px 7px 0 0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;width:100%;color:var(--brand);text-align:left;font-weight:600}.dialog-ai-summary-brand{display:flex;align-items:center;gap:6px}.dialog-ai-summary-actions{display:flex;align-items:center;gap:8px}.dialog-ai-summary-updated{font-size:10.5px;color:var(--z500);font-weight:400}.dialog-ai-summary-toggle{width:24px;height:24px;border:1px solid var(--z200);border-radius:5px;background:#fff;color:var(--z600);display:grid;place-items:center}.dialog-ai-summary-content{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:11px 12px}.dialog-ai-summary-empty{display:flex;align-items:center;gap:9px;padding:13px 12px;color:var(--z500);font-size:12px;line-height:1.5}.dialog-ai-summary-empty i{font-size:18px;color:var(--z400)}.dialog-ai-summary-label{font-size:10px;text-transform:uppercase;letter-spacing:.35px;color:var(--z500);font-weight:600;margin-bottom:5px}.dialog-ai-summary-list{margin:0;padding-left:15px}.dialog-ai-summary-list li{font-size:11px;line-height:1.5;color:var(--z700);margin-bottom:4px}.dialog-ai-summary.collapsed .dialog-ai-summary-content,.dialog-ai-summary.collapsed .dialog-ai-summary-empty{display:none}.dialog-ai-summary.collapsed .dialog-ai-summary-head{border-bottom:0}
.feedback-card{position:relative;border:1px solid var(--z200);border-radius:8px;padding:14px 16px;background:#fff;margin-bottom:9px}.fb-head{display:flex;gap:9px;padding-right:58px}.fb-line{font-size:12.5px;font-weight:600;color:var(--z900);display:flex;align-items:center;flex-wrap:wrap}.fb-date{font-size:11px;color:var(--z500);margin-top:2px}.fb-body{font-size:12.5px;line-height:1.6;color:var(--z700)}.cv-icons{position:absolute;right:12px;top:12px;display:flex;gap:3px}.cv-icon{width:28px;height:28px;object-fit:cover;border-radius:50%;background:transparent}.qa{margin:9px 0 0}.qa-q{display:block;width:100%;background:var(--brand-muted);color:var(--z700);font-size:12.5px;line-height:1.5;padding:7px 12px 8px;border-radius:10px 10px 10px 4px}.qa-label{display:block;font-size:10px;font-weight:600;line-height:1.3;text-transform:uppercase;letter-spacing:.35px;color:var(--z500);margin-bottom:2px}.qa-text{display:block}.qa-a{position:relative;margin:0 0 0 8px;padding-left:10px}.qa-a::before{content:'';position:absolute;left:0;top:-2px;width:10px;height:13px;border-left:2px solid var(--z200);border-bottom:2px solid var(--z200);border-bottom-left-radius:7px}.qa-a .fb-body{display:block;width:100%;margin:0;padding:4px 8px 1px}.qa-more{margin:8px 0 0 18px;border:0;background:transparent;color:var(--z600);font-size:11px;font-weight:600;padding:3px 0}.qa-more:hover{color:var(--brand)}.question-set{display:grid;gap:6px}.question-set-item{font-size:12px;line-height:1.5;color:var(--z700)}.pending-list{display:flex;flex-direction:column;gap:8px}.pending{display:block;padding:11px 12px;background:#fff;border:1px solid var(--z200);border-radius:7px}.pending-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.pending-status{display:inline-flex;align-items:center;gap:5px;color:var(--z600);font-size:11px;font-weight:600}.empty{padding:30px;text-align:center;color:var(--z500)}
.ticket-summary{background:var(--z50);padding:16px;overflow-y:auto;overflow-x:hidden}.summary-title{font-size:13px;font-weight:700;color:var(--z900);margin-bottom:14px}.summary-status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--warning-border);border-radius:6px;background:var(--warning-muted);color:var(--warning);font-size:11.5px;font-weight:600}.summary-status-overdue{color:var(--err);background:var(--err-bg);border-color:var(--err-bd)}.summary-status-complete{color:#16803a;background:#effbf3;border-color:#a7e9ba}.summary-progress{margin:16px 0}.summary-progress-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--z600);margin-bottom:7px}.summary-progress-head strong{color:var(--z900)}.summary-progress-track{height:6px;border-radius:20px;background:var(--z200);overflow:hidden}.summary-progress-fill{display:block;height:100%;border-radius:inherit;background:var(--brand)}.summary-list{border-top:1px solid var(--z200)}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--z200);font-size:11.5px;color:var(--z500)}.summary-row strong{color:var(--z700);font-weight:500;text-align:right}.summary-ai{margin-top:14px;padding:11px 12px;border:1px solid var(--z200);border-radius:7px;background:#fff}.summary-ai-title{font-size:12px;font-weight:600;color:var(--z800)}.summary-ai-copy{font-size:11px;line-height:1.5;color:var(--z500);margin-top:4px}.summary-ai-action{display:flex;justify-content:flex-end;margin-top:10px}.pms-tooltip{position:relative;display:inline-flex;align-items:center;cursor:help}.pms-tooltip-content{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);z-index:40;padding:5px 9px;background:var(--z900);color:#fff;border-radius:6px;font-size:12px;font-weight:500;line-height:1.4;white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s ease}.pms-tooltip-content::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-bottom-color:var(--z900)}.pms-tooltip-top{top:auto;bottom:calc(100% + 7px)}.pms-tooltip-top::after{top:100%;bottom:auto;border-bottom-color:transparent;border-top-color:var(--z900)}.pms-tooltip-floating{position:fixed;left:var(--tooltip-left);top:var(--tooltip-top);transform:translateX(-50%)}.pms-tooltip:hover .pms-tooltip-content,.pms-tooltip:focus-visible .pms-tooltip-content{opacity:1;visibility:visible}.reminder-tooltip-content{top:auto;bottom:calc(100% + 7px)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--z900);color:#fff;padding:9px 14px;border-radius:7px;display:none;z-index:50}.toast.show{display:block}
@media(max-width:1100px){.request-detail-layout{grid-template-columns:210px minmax(0,1fr) 250px}}@media(max-width:900px){.request-detail-layout{height:auto;max-height:none;grid-template-columns:220px minmax(0,1fr)}.ticket-summary{grid-column:1/-1;border-top:1px solid var(--z200)}.content-pane{max-height:650px;border-right:0}}@media(max-width:760px){.page{padding:16px}.head{flex-direction:column}.request-detail-layout{display:block}.rail{max-height:240px;border-right:0;border-bottom:1px solid var(--z200)}.content-pane{max-height:none}.pane-body{overflow:visible}.ticket-summary{border-top:1px solid var(--z200)}.dialog-ai-summary-content{grid-template-columns:1fr}}
.pms-tooltip-floating{bottom:auto}.question-disclosure{background:var(--brand-muted)}
</style>
</head>
<body>
<header class="topbar">MoMo Performance - Phản hồi</header>
<main class="page">
      <div class="breadcrumb"><a href="../H-05/index.html">Phản hồi</a> / Chương trình / Chi tiết</div>
      <header class="head"><h1 class="goal" id="programName"></h1><div class="head-actions"><a class="btn" href="../H-05/index.html"><i class="bx bx-arrow-back"></i> Quay lại</a></div></header>
      <div class="shell request-detail-layout">
        <aside class="rail"><div class="rail-title" id="participantCount"></div><div id="participantList"></div></aside>
        <section class="content-pane"><header class="pane-head"><div><div class="pane-title" id="employeeTitle"></div><div class="employee-badge-summary" id="employeeBadgeSummary" aria-label="Giá trị được ghi nhận"></div></div></header><div class="pane-body" id="detailBody" aria-live="polite"></div></section>
        <aside class="ticket-summary" id="overview" aria-label="Tổng quan chương trình"></aside>
      </div>
</main>
<div class="toast" id="toast"></div>
<script src="../H-05/feedback-program-data.js"></script>
<script src="../H-05/feedback-program-model.js"></script>
<script>
const TODAY='11/08/2026',NOW='11/08/2026 10:00';
const PROGRAM_ID=new URLSearchParams(location.search).get('id')||'s2';
const PROGRAM=FeedbackProgramData.programById(PROGRAM_ID)||FeedbackProgramData.programById('s2');
const DETAIL=FeedbackProgramData.detailForProgram(PROGRAM);
const ORDERED=FeedbackProgramModel.sortParticipantsForAction(PROGRAM,DETAIL.participants,TODAY);
const BADGE_ICON={teamwork:'Teamwork.png',customer:'Customer_.png',excellence:'Excellence.png',innovation:'Innovation.png',learning:'Constant_.png'};
const BADGE_LABEL={teamwork:'Tinh thần đồng đội',customer:'Khách hàng là trung tâm',excellence:'Thực thi xuất sắc',innovation:'Đổi mới',learning:'Không ngừng học hỏi'};
let SELECTED_ID=ORDERED[0]&&ORDERED[0].employee.id,AI_SUMMARY_COLLAPSED=false;
function personTooltip(person){return [person.department,person.team,person.position].filter(Boolean).join(' - ');}
function initials(person){return person.initials||String(person.name||'').split(' ').map(item=>item[0]).join('').slice(0,2);}
function groupAnswersByQuestion(participant,questions){return questions.map(question=>({question,answers:(participant.assignments||[]).filter(item=>item.status==='submitted').map(assignment=>({assignment,answer:(assignment.answers||[]).find(item=>item.questionId===question.id)})).filter(item=>item.answer&&item.answer.body)}));}
function responseBadges(assignment){return (assignment.badges||[]).map(id=>`<span class="pms-tooltip"><img class="cv-icon" src="../Core value with BG/${BADGE_ICON[id]||'Constant_.png'}" alt=""/><span class="pms-tooltip-content pms-tooltip-top">${BADGE_LABEL[id]||id}</span></span>`).join('');}
function questionAnswerRecord(item){const reviewer=item.assignment.reviewer;return `<article class="question-response"><div class="avatar">${initials(reviewer)}</div><div class="question-response-main"><div class="question-response-head"><div><div class="fb-line"><span class="pms-tooltip" tabindex="0">${reviewer.name}<span class="domain">(${reviewer.domain})</span><span class="pms-tooltip-content pms-tooltip-top">${personTooltip(reviewer)}</span></span></div><div class="fb-date">${item.assignment.submittedAt}</div></div>${item.assignment.badges&&item.assignment.badges.length?`<div class="cv-icons">${responseBadges(item.assignment)}</div>`:''}</div><p class="fb-body">${item.answer.body}</p></div></article>`;}
function questionEvidenceGroup(group,index,isSingleQuestion){const count=group.answers.length,question=isSingleQuestion?`<div class="shared-question single-question"><div class="label">Câu hỏi</div><p class="question-text">${group.question.text}</p></div>`:`<details class="question-disclosure"><summary><span class="question-disclosure-label">Câu ${index+1}</span><span class="question-response-count">${count} phản hồi</span></summary><p class="question-wording">${group.question.text}</p></details>`,answerContent=count?group.answers.map(questionAnswerRecord).join(''):!isSingleQuestion&&`<div class="question-empty">Chưa nhận phản hồi cho câu này</div>`;return `<section class="question-evidence-group${isSingleQuestion?' single-question-group':''}">${question}<div class="question-answers">${answerContent||''}</div></section>`;}
function renderParticipantList(){document.getElementById('participantCount').textContent=`Nhân viên nhận phản hồi (${ORDERED.length})`;document.getElementById('participantList').innerHTML=ORDERED.map(participant=>{const person=participant.employee,meta=progressMeta(participant);return `<button class="person${person.id===SELECTED_ID?' on':''}" aria-pressed="${person.id===SELECTED_ID}" onclick="selectParticipant('${person.id}')"><span class="avatar">${initials(person)}</span><span class="person-info"><span class="identity pms-tooltip" tabindex="0">${person.name}<span class="domain">(${person.domain})</span><span class="pms-tooltip-content pms-tooltip-top">${personTooltip(person)}</span></span><span class="small">${meta.text}</span></span></button>`;}).join('');}
function badgeSummary(participant){const tally=FeedbackProgramModel.coreValueTally(participant);return Object.entries(tally).map(([id,count])=>`<span class="employee-badge-item pms-tooltip" tabindex="0"><img src="../Core value with BG/${BADGE_ICON[id]||'Constant_.png'}" alt=""/><span>${count}</span><span class="pms-tooltip-content pms-tooltip-top">${BADGE_LABEL[id]||id}</span></span>`).join('');}
function aiSummary(participant){const collapsed=AI_SUMMARY_COLLAPSED?' collapsed':'';const ready=FeedbackProgramModel.isAiSummaryEligible(participant)&&participant.aiSummary;const toggle=`<span class="dialog-ai-summary-toggle"><i class="bx ${AI_SUMMARY_COLLAPSED?'bx-chevron-down':'bx-chevron-up'}"></i></span>`;if(!ready)return `<section class="dialog-ai-summary${collapsed}" id="employeeAiSummary"><button class="dialog-ai-summary-head" onclick="collapseAiSummary()" aria-expanded="${!AI_SUMMARY_COLLAPSED}" aria-label="${AI_SUMMARY_COLLAPSED?'Mở AI Summary':'Thu gọn AI Summary'}"><div class="dialog-ai-summary-brand"><i class="bx bx-sparkles"></i><span>AI Summary</span></div><div class="dialog-ai-summary-actions">${toggle}</div></button><div class="dialog-ai-summary-empty"><i class="bx bx-layer"></i><span>Cần ít nhất 2 phản hồi để tạo AI Summary.</span></div></section>`;const list=items=>`<ul class="dialog-ai-summary-list">${items.map(item=>`<li>${item}</li>`).join('')}</ul>`;return `<section class="dialog-ai-summary${collapsed}" id="employeeAiSummary"><button class="dialog-ai-summary-head" onclick="collapseAiSummary()" aria-expanded="${!AI_SUMMARY_COLLAPSED}" aria-label="${AI_SUMMARY_COLLAPSED?'Mở AI Summary':'Thu gọn AI Summary'}"><div class="dialog-ai-summary-brand"><i class="bx bx-sparkles"></i><span>AI Summary</span></div><div class="dialog-ai-summary-actions"><span class="dialog-ai-summary-updated">Cập nhật: 11/08/2026</span>${toggle}</div></button><div class="dialog-ai-summary-content"><section><div class="dialog-ai-summary-label">Điểm mạnh</div>${list(participant.aiSummary.strengths)}</section><section><div class="dialog-ai-summary-label">Cơ hội phát triển</div>${list(participant.aiSummary.opportunities)}</section></div></section>`;}
function pendingRows(participant){return participant.assignments.filter(item=>item.status!=='submitted').map(assignment=>{const reviewer=assignment.reviewer;return `<div class="pending"><div class="pending-head"><span class="identity pms-tooltip" tabindex="0">${reviewer.name}<span class="domain">(${reviewer.domain})</span><span class="pms-tooltip-content pms-tooltip-top">${personTooltip(reviewer)}</span></span><span class="pending-status"><i class="bx bx-time-five"></i>Chưa trả lời</span></div></div>`;}).join('');}
function renderProgramOverview(){const data=FeedbackProgramModel.programDetailOverview(DETAIL,TODAY),eligible=DETAIL.participants.flatMap(item=>item.assignments||[]).some(item=>FeedbackProgramModel.canRemindProgramAssignment(PROGRAM,item,NOW)),percent=PROGRAM.total?Math.round(PROGRAM.done/PROGRAM.total*100):0,overdue=FeedbackProgramModel.isOverdue(PROGRAM,TODAY),complete=PROGRAM.done===PROGRAM.total,status=overdue?'Quá hạn':complete?'Hoàn thành':'Đang thu thập',state=overdue?'overdue':complete?'complete':'collecting',statusIcon=overdue?'bx-error-circle':complete?'bx-check-circle':'bx-loader-circle';document.getElementById('overview').innerHTML=`<div class="summary-title">Tổng quan chương trình</div><div class="summary-status summary-status-${state}"><i class="bx ${statusIcon}"></i>${status}</div><div class="summary-progress"><div class="summary-progress-head"><span>Tiến độ phản hồi</span><strong>${PROGRAM.done}/${PROGRAM.total} đã trả lời</strong></div><div class="summary-progress-track"><span class="summary-progress-fill" style="width:${percent}%"></span></div></div><div class="summary-list"><div class="summary-row"><span>Ngày tạo</span><strong>${PROGRAM.createdAt}</strong></div><div class="summary-row"><span>Hạn phản hồi</span><strong>${PROGRAM.due}</strong></div><div class="summary-row"><span>Nhân viên nhận phản hồi</span><strong>${data.participants}</strong></div><div class="summary-row"><span>Người cho phản hồi</span><strong>${data.reviewers}</strong></div><div class="summary-row"><span>Phản hồi đang chờ</span><strong>${data.pending}</strong></div></div>${data.pending?`<section class="summary-ai"><div class="summary-ai-title">Cần nhắc</div><div class="summary-ai-copy">${data.pending} phản hồi chưa trả lời</div><div class="summary-ai-action"><button class="btn btn-outline btn-remind pms-tooltip reminder-tooltip" onclick="sendEligibleReminders()" ${eligible?'':'disabled'}><i class="bx bx-bell"></i> Nhắc<span class="pms-tooltip-content reminder-tooltip-content">Nhắc những người chưa trả lời đang đủ điều kiện nhận nhắc</span></button></div></section>`:''}`;}
function selectParticipant(participantId){SELECTED_ID=participantId;renderDetail();}
function collapseAiSummary(){AI_SUMMARY_COLLAPSED=!AI_SUMMARY_COLLAPSED;renderDetail();}
function sendEligibleReminders(){const count=FeedbackProgramModel.remindEligibleProgramAssignments(PROGRAM,DETAIL.participants,NOW);toast(count?`Đã nhắc ${count} người chưa trả lời đủ điều kiện`:'Hiện chưa có ai đủ điều kiện để nhắc');renderDetail();}
function renderHeader(){document.getElementById('programName').textContent=PROGRAM.goal;}
function bindClippedTooltips(){document.querySelectorAll('.rail .pms-tooltip,.pane-head .pms-tooltip,.cv-icons .pms-tooltip').forEach(trigger=>{const content=trigger.querySelector('.pms-tooltip-content');if(!content)return;const place=()=>{const rect=trigger.getBoundingClientRect(),width=content.offsetWidth||180,height=content.offsetHeight||30,left=Math.max(width/2+8,Math.min(window.innerWidth-width/2-8,rect.left+rect.width/2)),above=rect.top>height+14;content.classList.add('pms-tooltip-floating');content.classList.toggle('pms-tooltip-top',above);content.style.setProperty('--tooltip-left',`${left}px`);content.style.setProperty('--tooltip-top',`${above?rect.top-height-7:rect.bottom+7}px`);};trigger.addEventListener('mouseenter',place);trigger.addEventListener('focusin',place);});}
function toast(message){const element=document.getElementById('toast');element.textContent=message;element.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>element.classList.remove('show'),2600);}
function bindClippedTooltips(){document.querySelectorAll('.rail .pms-tooltip,.pane-head .pms-tooltip,.question-response .pms-tooltip,.cv-icons .pms-tooltip').forEach(trigger=>{const content=trigger.querySelector('.pms-tooltip-content');if(!content)return;const place=()=>{const rect=trigger.getBoundingClientRect(),width=content.offsetWidth||180,height=content.offsetHeight||30,left=Math.max(width/2+8,Math.min(window.innerWidth-width/2-8,rect.left+rect.width/2)),above=rect.top>height+14;content.classList.add('pms-tooltip-floating');content.classList.toggle('pms-tooltip-top',above);content.style.setProperty('--tooltip-left',`${left}px`);content.style.setProperty('--tooltip-top',`${above?rect.top-height-7:rect.bottom+7}px`);};trigger.addEventListener('mouseenter',place);trigger.addEventListener('focusin',place);});}
function progressMeta(participant){const progress=FeedbackProgramModel.participantProgress(participant);return {text:`Đã nhận: ${progress.done}/${progress.total} người phản hồi`};}
function renderDetail(){const participant=DETAIL.participants.find(item=>item.employee.id===SELECTED_ID)||ORDERED[0];if(!participant)return;const person=participant.employee,questions=DETAIL.questions||[{id:'q1',text:DETAIL.question}],groups=groupAnswersByQuestion(participant,questions),isSingleQuestion=questions.length===1;document.getElementById('employeeTitle').textContent=`Phản hồi đã nhận của ${person.name}`;document.getElementById('employeeBadgeSummary').innerHTML=badgeSummary(participant);document.getElementById('detailBody').innerHTML=`${aiSummary(participant)}${groups.map((group,index)=>questionEvidenceGroup(group,index,isSingleQuestion)).join('')}${pendingRows(participant)?`<div class="pending-list">${pendingRows(participant)}</div>`:''}`;renderParticipantList();renderProgramOverview();bindClippedTooltips();}
renderHeader();renderDetail();
</script>
</body>
