<body>
<header class="topbar">MoMo Performance - Phản hồi</header>
<main class="page">
      <div class="breadcrumb"><a href="../H-05/index.html">Phản hồi</a> / Chương trình / Chi tiết</div>
      <header class="head"><h1 class="goal" id="programName"></h1><div class="head-actions"><div id="programActions"></div><button type="button" class="btn btn-outline btn-share" title="Tải xuống" onclick="(window.toast||window.notify||function(){})('Đang chuẩn bị tệp tải xuống...')"><i class="bx bx-download"></i></button><a class="btn btn-outline" href="../H-05/index.html"><i class="bx bx-arrow-back"></i> Quay lại</a></div></header>
      <div class="shell request-detail-layout">
        <aside class="rail"><div class="rail-title" id="participantCount"></div><div id="participantList"></div></aside>
        <section class="content-pane"><header class="pane-head"><div class="pane-title" id="employeeTitle"></div><div class="pane-actions" id="participantActions"></div></header><div class="pane-body" id="detailBody" aria-live="polite"></div></section>
        <aside class="ticket-summary" id="overview" aria-label="Tổng quan chương trình"></aside>
        <div class="rail-resizer" id="railResizer" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Kéo để đổi độ rộng cột danh sách"></div>
      </div>
</main>
<div class="toast" id="toast"></div>
<div class="dialog-overlay" id="resultDialog" role="dialog" aria-modal="true" aria-labelledby="resultDialogTitle" onclick="if(event.target===this)closeResultDialog()"><section class="confirm-dialog" id="resultDialogSurface"><div class="confirm-title" id="resultDialogTitle"></div><p class="confirm-copy" id="resultDialogCopy"></p><div class="share-result-settings" id="shareResultSettings"></div><div class="confirm-actions"><button class="btn btn-primary btn-share" id="resultDialogConfirm" type="button"></button></div></section></div>
<script src="../assets/employees-data.js"></script>
<script src="../H-05/feedback-program-data.js"></script>
<script src="../H-05/feedback-program-model.js"></script>
<script>
const TODAY='11/08/2026',NOW='11/08/2026 10:00';
const PROGRAM_ID=new URLSearchParams(location.search).get('id')||'s2';
const STORE_KEY='uc5_campaigns';
function savedProgram(id){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]').find(item=>item.id===id)||null;}catch(error){return null;}}
function localPerson(person){return {...person,domain:person.domain||person.dom||'',initials:person.initials||person.ini||''};}
function detailForLocalProgram(program){const reviewerById=new Map((program.reviewers||[]).map(person=>[person.id,localPerson(person)]));const mappings=program.reviewerMappings||[];return {campaign:program,questions:program.questions||[],participants:(program.participants||[]).map(person=>{const employee=localPerson(person),mapping=mappings.find(item=>item.participantId===employee.id)||{reviewerIds:[]};return {employee,assignments:mapping.reviewerIds.map(reviewerId=>({id:`${employee.id}:${reviewerId}`,reviewer:reviewerById.get(reviewerId)||{id:reviewerId,name:reviewerId,domain:'',initials:''},status:'pending',answers:[],badges:[],manualReminderHistory:[]}))};})};}
const SAVED_PROGRAM=savedProgram(PROGRAM_ID);
let PROGRAM=FeedbackProgramModel.normalizeCampaign(SAVED_PROGRAM||FeedbackProgramData.programById(PROGRAM_ID)||FeedbackProgramData.programById('s2'));
let DETAIL=SAVED_PROGRAM&&SAVED_PROGRAM.detailParticipants?{campaign:PROGRAM,questions:PROGRAM.questions||[],participants:SAVED_PROGRAM.detailParticipants}:SAVED_PROGRAM?detailForLocalProgram(PROGRAM):FeedbackProgramData.detailForProgram(PROGRAM);
let ORDERED=FeedbackProgramModel.sortParticipantsForAction(PROGRAM,DETAIL.participants,TODAY);
const BADGE_ICON={teamwork:'Teamwork.png',customer:'Customer_.png',excellence:'Excellence.png',innovation:'Innovation.png',learning:'Constant_.png'};
const BADGE_LABEL={teamwork:'Tinh thần đồng đội',customer:'Khách hàng là trung tâm',excellence:'Thực thi xuất sắc',innovation:'Đổi mới',learning:'Không ngừng học hỏi'};
let SELECTED_ID=ORDERED[0]&&ORDERED[0].employee.id,AI_SUMMARY_COLLAPSED=false,PENDING_DIALOG=null;
function personTooltip(person){return [person.department,person.team,person.position].filter(Boolean).join(' - ');}
function initials(person){return person.initials||String(person.name||'').split(' ').map(item=>item[0]).join('').slice(0,2);}
function groupAnswersByQuestion(participant,questions){return questions.map(question=>({question,answers:(participant.assignments||[]).filter(item=>item.status==='submitted').map(assignment=>({assignment,question,answer:(assignment.answers||[]).find(item=>item.questionId===question.id)})).filter(item=>item.answer&&(item.answer.body||Number.isFinite(Number(item.answer.score))))}));}
function responseBadges(assignment){return (assignment.badges||[]).map(id=>`<span class="pms-tooltip"><img class="cv-icon" src="../Core value with BG/${BADGE_ICON[id]||'Constant_.png'}" alt=""/><span class="pms-tooltip-content pms-tooltip-top">${BADGE_LABEL[id]||id}</span></span>`).join('');}
function isAnon(){return PROGRAM.identityVisibility==='anonymous';}
function reviewerAvatar(reviewer){return isAnon()?`<div class="avatar avatar-anon" aria-hidden="true"><i class="bx bx-user"></i></div>`:`<div class="avatar">${initials(reviewer)}</div>`;}
function reviewerIdentity(reviewer){return isAnon()?`<span class="identity-text identity-anon">Ẩn danh</span>`:`<span class="pms-tooltip" tabindex="0"><span class="identity-text">${reviewer.name}<span class="domain">(${reviewer.domain})</span></span><span class="pms-tooltip-content pms-tooltip-top">${personTooltip(reviewer)}</span></span>`;}
function questionAnswerRecord(item){const reviewer=item.assignment.reviewer,rating=item.question.type==='rating'?`<span class="rating-answer">${item.answer.score}/${item.question.ratingScale}</span>`:'',self=item.assignment.selfAssessment?'<span class="self-assessment-tag">Tự đánh giá</span>':'';return `<article class="question-response">${reviewerAvatar(reviewer)}<div class="question-response-main"><div class="question-response-head"><div><div class="fb-line">${reviewerIdentity(reviewer)}${self}</div><div class="fb-date">${item.assignment.submittedAt}</div></div></div>${rating}${item.answer.body?`<p class="fb-body">${item.answer.body}</p>`:''}</div></article>`;}
function questionEvidenceGroup(group,index,isSingleQuestion){const count=group.answers.length,label=isSingleQuestion?'Câu hỏi':`Câu ${index+1}`,question=`<div class="shared-question q-collapse"><div class="question-head"><p class="question-text q-text"><span class="q-label">${label}:</span> ${group.question.text}</p>${isSingleQuestion?'':`<span class="question-response-count">${count} phản hồi</span>`}</div><button class="q-more" type="button" onclick="toggleQuestion(this)" hidden>Xem thêm</button></div>`,answerContent=count?group.answers.map(questionAnswerRecord).join(''):!isSingleQuestion&&`<div class="question-empty">Chưa nhận phản hồi cho câu này</div>`;return `<section class="question-evidence-group${isSingleQuestion?' single-question-group':''}">${question}<div class="question-answers">${answerContent||''}</div></section>`;}
function renderParticipantList(){document.getElementById('participantCount').textContent=`Nhân viên nhận phản hồi (${ORDERED.length})`;document.getElementById('participantList').innerHTML=ORDERED.map(participant=>{const person=participant.employee,meta=progressMeta(participant),shared=FeedbackProgramModel.isResultShared(PROGRAM,person.id),lockKind=recipientLockKind(participant);return `<button class="person${person.id===SELECTED_ID?' on':''}" aria-pressed="${person.id===SELECTED_ID}" onclick="selectParticipant('${person.id}')"><span class="avatar">${initials(person)}</span><span class="person-info"><span class="identity pms-tooltip" tabindex="0"><span class="identity-text">${person.name}<span class="domain">(${person.domain})</span></span><span class="pms-tooltip-content pms-tooltip-top">${personTooltip(person)}</span></span><span class="small">${meta.text}</span></span>${shared?`<i class="bx bx-check-double person-shared" title="Đã chia sẻ kết quả"></i>`:lockKind?`<i class="bx bx-lock-alt person-lock" title="Đã đóng"></i>`:''}</button>`;}).join('');}
function badgeSummary(participant){const tally=FeedbackProgramModel.coreValueTally(participant);return Object.entries(tally).map(([id,count])=>`<span class="employee-badge-item pms-tooltip" tabindex="0"><img src="../Core value with BG/${BADGE_ICON[id]||'Constant_.png'}" alt=""/><span>${count}</span><span class="pms-tooltip-content pms-tooltip-top">${BADGE_LABEL[id]||id}</span></span>`).join('');}
function aiSummary(participant){const collapsed=AI_SUMMARY_COLLAPSED?' collapsed':'';const ready=FeedbackProgramModel.isAiSummaryEligible(participant)&&participant.aiSummary;const toggle=`<span class="dialog-ai-summary-toggle"><i class="bx ${AI_SUMMARY_COLLAPSED?'bx-chevron-down':'bx-chevron-up'}"></i></span>`;if(!ready)return `<section class="dialog-ai-summary${collapsed}" id="employeeAiSummary"><button class="dialog-ai-summary-head" onclick="collapseAiSummary()" aria-expanded="${!AI_SUMMARY_COLLAPSED}" aria-label="${AI_SUMMARY_COLLAPSED?'Mở AI Summary':'Thu gọn AI Summary'}"><div class="dialog-ai-summary-brand"><i class="bx bx-sparkles"></i><span>AI Summary</span></div><div class="dialog-ai-summary-actions">${toggle}</div></button><div class="dialog-ai-summary-empty"><i class="bx bx-layer"></i><span>Cần ít nhất 2 phản hồi để tạo AI Summary.</span></div></section>`;const list=items=>`<ul class="dialog-ai-summary-list">${items.map(item=>`<li>${item}</li>`).join('')}</ul>`;return `<section class="dialog-ai-summary${collapsed}" id="employeeAiSummary"><button class="dialog-ai-summary-head" onclick="collapseAiSummary()" aria-expanded="${!AI_SUMMARY_COLLAPSED}" aria-label="${AI_SUMMARY_COLLAPSED?'Mở AI Summary':'Thu gọn AI Summary'}"><div class="dialog-ai-summary-brand"><i class="bx bx-sparkles"></i><span>AI Summary</span></div><div class="dialog-ai-summary-actions"><span class="dialog-ai-summary-updated">Cập nhật: 11/08/2026</span>${toggle}</div></button><div class="dialog-ai-summary-content"><section><div class="dialog-ai-summary-label">Điểm mạnh</div>${list(participant.aiSummary.strengths)}</section><section><div class="dialog-ai-summary-label">Cơ hội phát triển</div>${list(participant.aiSummary.opportunities)}</section></div></section>`;}
function pendingRows(participant){return participant.assignments.filter(item=>item.status!=='submitted').map(assignment=>{const reviewer=assignment.reviewer,locked=assignment.status==='locked',canRemind=FeedbackProgramModel.canRemindProgramAssignment(PROGRAM,assignment,NOW),remindTitle=canRemind?'Gửi lời nhắc thủ công':PROGRAM.status!=='collecting'?'Chương trình đã đóng, không thể gửi nhắc':'Chờ đủ 24 giờ kể từ lần nhắc gần nhất';return `<div class="pending"><div class="pending-head">${isAnon()?`<span class="identity"><span class="identity-text identity-anon">Ẩn danh</span></span>`:`<span class="identity pms-tooltip" tabindex="0"><span class="identity-text">${reviewer.name}<span class="domain">(${reviewer.domain})</span></span><span class="pms-tooltip-content pms-tooltip-top">${personTooltip(reviewer)}</span></span>`}<div class="pending-actions"><span class="pending-tag"><i class="bx ${locked?'bx-lock-alt':'bx-time-five'}"></i>${locked?'Đóng':'Chưa trả lời'}</span>${locked||isAnon()?'':`<button class="btn btn-pending-remind" onclick="remindOneAssignment('${assignment.id}')" ${canRemind?'':'disabled'} title="${remindTitle}"><i class="bx bx-bell"></i> Nhắc</button>`}</div></div>${reminderMeta(assignment)}</div>`;}).join('');}
function reminderMeta(assignment){if(isAnon())return `<div class="reminder-meta"><span class="reminder-summary reminder-anon"><i class="bx bx-info-circle"></i>Không thể nhắc khi người cho phản hồi ẩn danh</span></div>`;const history=assignment.manualReminderHistory||[];if(!history.length)return `<div class="reminder-meta"><span class="reminder-summary"><i class="bx bx-calendar"></i>Hệ thống sẽ tự động nhắc ngày ${autoRemindDate()}</span></div>`;const details=history.map((at,index)=>`Lần ${index+1}: ${at}`).join('<br>');return `<div class="reminder-meta"><span class="reminder-summary pms-tooltip" tabindex="0"><i class="bx bx-bell"></i>Đã nhắc: ${history.length} lần<i class="bx bx-info-circle reminder-info" aria-hidden="true"></i><span class="pms-tooltip-content reminder-history-tip" role="tooltip">${details}</span></span></div>`;}
function autoRemindDate(){const parts=String(PROGRAM.due||'').split('/');if(parts.length!==3)return PROGRAM.due||'';const date=new Date(+parts[2],+parts[1]-1,+parts[0]);date.setDate(date.getDate()-3);const pad=value=>String(value).padStart(2,'0');return `${pad(date.getDate())}/${pad(date.getMonth()+1)}/${date.getFullYear()}`;}
function remindOneAssignment(assignmentId){const assignment=DETAIL.participants.flatMap(item=>item.assignments||[]).find(item=>item.id===assignmentId);if(!assignment||!FeedbackProgramModel.canRemindProgramAssignment(PROGRAM,assignment,NOW))return;assignment.manualReminderHistory=[...(assignment.manualReminderHistory||[]),NOW];toast('Đã gửi lời nhắc.');renderDetail();}
function persistProgramState(){if(!SAVED_PROGRAM)return;let saved=[];try{saved=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');}catch(error){saved=[];}localStorage.setItem(STORE_KEY,JSON.stringify(saved.map(item=>item.id===PROGRAM.id?{...PROGRAM,detailParticipants:DETAIL.participants}:item)));}
function renderProgramActions(){const actions=document.getElementById('programActions');if(!actions)return;const parts=[];if(PROGRAM.status==='collecting')parts.push(`<button class="btn btn-outline btn-share" type="button" onclick="requestTicketClosure()"><i class="bx bx-lock-alt"></i> Đóng yêu cầu</button>`);if(PROGRAM.status==='closed'&&!programHasShare())parts.push(`<button class="btn btn-outline btn-share" type="button" onclick="reopenProgram()"><i class="bx bx-lock-open-alt"></i> Mở lại</button>`);actions.innerHTML=parts.join('');}
function recipientLockKind(participant){if(!participant)return null;const prog=FeedbackProgramModel.participantProgress(participant);if(prog.total>0&&prog.done>=prog.total)return 'complete';if(participant.closed)return 'manual';return null;}
function isRecipientClosed(participant){return Boolean(recipientLockKind(participant));}
function renderParticipantActions(participant){const target=document.getElementById('participantActions');if(!target)return;const id=participant.employee.id,multi=(DETAIL.participants||[]).length>=2,shared=FeedbackProgramModel.isResultShared(PROGRAM,id),closed=isRecipientClosed(participant),hasPending=participant.assignments.some(item=>item.status!=='submitted'&&item.status!=='locked'),canRemind=participant.assignments.some(item=>FeedbackProgramModel.canRemindProgramAssignment(PROGRAM,item,NOW)),parts=[];if(shared&&multi){parts.push('<span class="ticket-status shared"><i class="bx bx-check-circle"></i>Đã chia sẻ kết quả</span>');}else if(closed&&multi){const kind=recipientLockKind(participant);parts.push(`<span class="ticket-lock" title="Đã đóng"><i class="bx bx-lock-alt"></i></span>`);if(kind==='manual'&&!shared)parts.push(`<button class="btn btn-outline btn-share" type="button" onclick="reopenParticipant('${id}')"><i class="bx bx-lock-open-alt"></i> Mở lại</button>`);}else if(hasPending&&!isAnon()){parts.push(`<button class="btn btn-remind" type="button" onclick="remindParticipant('${id}')" ${canRemind?'':'disabled'}><i class="bx bx-bell"></i> Nhắc người chưa trả lời</button>`);}target.innerHTML=parts.join('');}
function reopenParticipant(id){const participant=DETAIL.participants.find(item=>item.employee.id===id);if(!participant||FeedbackProgramModel.isResultShared(PROGRAM,id))return;participant.closed=false;delete participant.closedAt;participant.assignments=(participant.assignments||[]).map(assignment=>assignment.status==='locked'?{...assignment,status:'pending'}:assignment);if(PROGRAM.status==='closed'){PROGRAM={...PROGRAM,status:'collecting'};delete PROGRAM.closedAt;}persistProgramState();renderDetail();toast('Đã mở lại yêu cầu cho người nhận này.');}
function programHasShare(){const mode=(PROGRAM.resultSharing||{}).mode;return Boolean(mode&&mode!=='not_shared');}
function reopenProgram(){if(programHasShare())return;PROGRAM={...PROGRAM,status:'collecting'};delete PROGRAM.closedAt;DETAIL.participants.forEach(participant=>{participant.closed=false;delete participant.closedAt;participant.assignments=(participant.assignments||[]).map(assignment=>assignment.status==='locked'?{...assignment,status:'pending'}:assignment);});persistProgramState();renderDetail();toast('Đã mở lại toàn bộ yêu cầu.');}
function closeResultDialog(){PENDING_DIALOG=null;document.getElementById('resultDialog').classList.remove('open');}
let CLOSE_STATE={scope:'all',ids:[]};let SHARE_AFTER_CLOSE=false;
function afterCloseFlow(message){renderDetail();if(SHARE_AFTER_CLOSE){SHARE_AFTER_CLOSE=false;setTimeout(()=>showCloseSuccessThenShare(message),0);}else{toast(message);}}
function showCloseSuccessThenShare(message){openResultDialog('Đã đóng yêu cầu thành công','Bạn có thể tiếp tục chia sẻ kết quả ngay bây giờ.','Tiếp tục chia sẻ kết quả',()=>{requestResultShare('all');return false;});const confirm=document.getElementById('resultDialogConfirm');confirm.className='btn btn-primary';const cancel=document.createElement('button');cancel.id='resultDialogCancel';cancel.type='button';cancel.className='btn btn-outline';cancel.textContent='Để sau';cancel.onclick=closeResultDialog;confirm.parentNode.insertBefore(cancel,confirm);}
function openRecipientsForClose(){return DETAIL.participants.filter(participant=>!participant.closed&&(participant.assignments||[]).some(assignment=>assignment.status!=='submitted'&&assignment.status!=='locked'));}
function requestTicketClosure(){SHARE_AFTER_CLOSE=false;CLOSE_STATE={scope:'all',ids:[]};openResultDialog('Đóng yêu cầu','Chọn phạm vi đóng cho yêu cầu phản hồi này.','Đóng yêu cầu',()=>{if(CLOSE_STATE.scope==='some'){if(!CLOSE_STATE.ids.length){toast('Chọn ít nhất một người nhận để đóng.');return false;}closePartialRecipients(CLOSE_STATE.ids);}else{confirmTicketClosure();}});document.getElementById('resultDialogSurface').classList.add('share-dialog');document.getElementById('resultDialogConfirm').className='btn btn-primary btn-share';renderCloseSettings();}
function renderCloseSettings(){const openList=openRecipientsForClose(),some=CLOSE_STATE.scope==='some';const rows=openList.map(participant=>{const person=participant.employee,open=(participant.assignments||[]).filter(assignment=>assignment.status!=='submitted'&&assignment.status!=='locked').length,on=CLOSE_STATE.ids.includes(person.id);return `<label class="close-recipient${on?' on':''}"><input type="checkbox" ${on?'checked':''} onchange="toggleCloseRecipient('${person.id}')"/><span class="avatar">${initials(person)}</span><span class="cr-info"><span class="cr-name">${person.name}<span class="domain">(${person.domain})</span></span><span class="cr-meta">Còn ${open} người chưa trả lời</span></span></label>`;}).join('');const listBlock=openList.length?`<div class="close-recipient-list">${rows}</div>`:`<div class="close-empty">Tất cả người nhận đã hoàn tất hoặc đã đóng.</div>`;document.getElementById('shareResultSettings').innerHTML=`<section class="share-section"><div class="share-audience-options"><label class="share-audience-option${some?'':' on'}"><input type="radio" name="closeScope" ${some?'':'checked'} onchange="setCloseScope('all')"/><span><strong>Đóng toàn bộ yêu cầu</strong><small>Ngừng thu thập cho tất cả người nhận. Người chưa trả lời sẽ không gửi được nữa.</small></span></label><label class="share-audience-option${some?' on':''}"><input type="radio" name="closeScope" ${some?'checked':''} onchange="setCloseScope('some')"/><span><strong>Đóng yêu cầu theo người nhận</strong><small>Chọn 1 hoặc nhiều người nhận để đóng; những người còn lại vẫn tiếp tục thu thập.</small></span></label></div></section><section class="share-section close-recipient-section${some?'':' hidden'}"><span class="share-section-label">Chọn người nhận cần đóng</span>${listBlock}</section>`;}
function setCloseScope(scope){CLOSE_STATE.scope=scope;renderCloseSettings();}
function toggleCloseRecipient(id){const index=CLOSE_STATE.ids.indexOf(id);if(index>=0)CLOSE_STATE.ids.splice(index,1);else CLOSE_STATE.ids.push(id);renderCloseSettings();}
function closePartialRecipients(ids){DETAIL.participants.forEach(participant=>{if(ids.includes(participant.employee.id)){participant.assignments=(participant.assignments||[]).map(assignment=>assignment.status==='pending'?{...assignment,status:'locked'}:assignment);participant.closed=true;participant.closedAt=TODAY;}});const allClosed=DETAIL.participants.every(participant=>participant.closed||(participant.assignments||[]).every(assignment=>assignment.status==='submitted'));if(allClosed)PROGRAM=FeedbackProgramModel.closeCampaign(PROGRAM,TODAY);persistProgramState();afterCloseFlow(allClosed?'Đã đóng toàn bộ yêu cầu.':`Đã đóng yêu cầu cho ${ids.length} người nhận.`);}
function confirmTicketClosure(){PROGRAM=FeedbackProgramModel.closeCampaign(PROGRAM,TODAY);DETAIL.participants.forEach(participant=>{participant.closed=true;participant.closedAt=TODAY;participant.assignments=(participant.assignments||[]).map(assignment=>assignment.status==='pending'?{...assignment,status:'locked'}:assignment);});persistProgramState();afterCloseFlow('Đã đóng toàn bộ yêu cầu.');}
function selectParticipant(participantId){SELECTED_ID=participantId;renderDetail();}
function collapseAiSummary(){AI_SUMMARY_COLLAPSED=!AI_SUMMARY_COLLAPSED;renderDetail();}
function sendEligibleReminders(){const count=FeedbackProgramModel.remindEligibleProgramAssignments(PROGRAM,DETAIL.participants,NOW);toast(count?`Đã nhắc ${count} người chưa trả lời đủ điều kiện`:'Hiện chưa có ai đủ điều kiện để nhắc');renderDetail();}
function remindParticipant(participantId){const participant=DETAIL.participants.find(item=>item.employee.id===participantId);if(!participant)return;const count=FeedbackProgramModel.remindEligibleProgramAssignments(PROGRAM,[participant],NOW);toast(count?`Đã nhắc ${count} người chưa trả lời đủ điều kiện`:'Hiện chưa có ai đủ điều kiện để nhắc');renderDetail();}
function renderHeader(){document.getElementById('programName').textContent=PROGRAM.goal;renderProgramActions();}
function bindClippedTooltips(){document.querySelectorAll('.rail .pms-tooltip,.pane-head .pms-tooltip,.cv-icons .pms-tooltip').forEach(trigger=>{const content=trigger.querySelector('.pms-tooltip-content');if(!content)return;const place=()=>{const rect=trigger.getBoundingClientRect(),width=content.offsetWidth||180,height=content.offsetHeight||30,left=Math.max(width/2+8,Math.min(window.innerWidth-width/2-8,rect.left+rect.width/2)),above=rect.top>height+14;content.classList.add('pms-tooltip-floating');content.classList.toggle('pms-tooltip-top',above);content.style.setProperty('--tooltip-left',`${left}px`);content.style.setProperty('--tooltip-top',`${above?rect.top-height-7:rect.bottom+7}px`);};trigger.addEventListener('mouseenter',place);trigger.addEventListener('focusin',place);});}
function toast(message){const element=document.getElementById('toast');element.textContent=message;element.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>element.classList.remove('show'),2600);}
function bindClippedTooltips(){document.querySelectorAll('.rail .pms-tooltip,.pane-head .pms-tooltip,.question-response .pms-tooltip,.pending .pms-tooltip,.cv-icons .pms-tooltip').forEach(trigger=>{const content=trigger.querySelector('.pms-tooltip-content');if(!content)return;const place=()=>{const rect=trigger.getBoundingClientRect(),width=content.offsetWidth||180,height=content.offsetHeight||30,left=Math.max(width/2+8,Math.min(window.innerWidth-width/2-8,rect.left+rect.width/2)),above=rect.top>height+14;content.classList.add('pms-tooltip-floating');content.classList.toggle('pms-tooltip-top',above);content.style.setProperty('--tooltip-left',`${left}px`);content.style.setProperty('--tooltip-top',`${above?rect.top-height-7:rect.bottom+7}px`);};trigger.addEventListener('mouseenter',place);trigger.addEventListener('focusin',place);});}
function progressMeta(participant){const progress=FeedbackProgramModel.participantProgress(participant);return {text:`Đã nhận: ${progress.done}/${progress.total} người phản hồi`};}
function toggleQuestion(btn){const box=btn.closest('.q-collapse');if(!box)return;const open=box.classList.toggle('open');btn.textContent=open?'Thu gọn':'Xem thêm';}
function initQuestionCollapse(root){(root||document).querySelectorAll('.q-collapse').forEach(box=>{const txt=box.querySelector('.q-text'),btn=box.querySelector('.q-more');if(!txt||!btn||box.classList.contains('open'))return;btn.hidden=txt.scrollWidth<=txt.clientWidth+1;});}
function renderDetail(){ORDERED=FeedbackProgramModel.sortParticipantsForAction(PROGRAM,DETAIL.participants,TODAY);const participant=DETAIL.participants.find(item=>item.employee.id===SELECTED_ID)||ORDERED[0];if(!participant)return;SELECTED_ID=participant.employee.id;const person=participant.employee,questions=DETAIL.questions||[{id:'q1',text:DETAIL.question}],groups=groupAnswersByQuestion(participant,questions),isSingleQuestion=questions.length===1;document.getElementById('employeeTitle').textContent=`Phản hồi đã nhận của ${person.name}`;document.getElementById('detailBody').innerHTML=`${aiSummary(participant)}${groups.map((group,index)=>questionEvidenceGroup(group,index,isSingleQuestion)).join('')}${pendingRows(participant)?`<div class="label">${PROGRAM.status==='closed'||participant.closed?'Đóng':'Cần phản hồi'}</div><div class="pending-list">${pendingRows(participant)}</div>`:''}`;renderHeader();renderParticipantActions(participant);renderParticipantList();renderProgramOverview();bindClippedTooltips();initQuestionCollapse(document.getElementById('detailBody'));}
/* Initial render lives in the next <script> block (after renderProgramOverview is defined) to avoid a load-order ReferenceError. */
</script>
<script>
var RESULT_SHARE_STATE={scope:'',audience:'',additionalViewerNames:[],personQuery:'',contentLevel:'summary_detail',note:''};
function escapeResultShare(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function audienceCopy(audience){return {recipient_and_managers:'Người nhận phản hồi và các cấp quản lý của họ',managers_only:'Chỉ các cấp quản lý của người nhận',specific_people:'Người cụ thể'}[audience]||''}
function resultIdentityCopy(){return PROGRAM.identityVisibility==='anonymous'?'Chỉ hiển thị nội dung phản hồi.':'Hiển thị tên người cho phản hồi cùng nội dung.'}
function resultSharePeople(){const query=String(RESULT_SHARE_STATE.personQuery||'').trim().toLocaleLowerCase('vi'),selected=new Set(RESULT_SHARE_STATE.additionalViewerNames);return (window.PMS_EMPLOYEES||[]).filter(person=>{const searchable=`${person.name||''} ${person.login||person.domain||''}`.toLocaleLowerCase('vi');return !selected.has(person.name)&&(!query||searchable.includes(query));}).slice(0,6)}
function resultShareSuggestionHTML(){const query=String(RESULT_SHARE_STATE.personQuery||'').trim();if(!query)return '';const people=resultSharePeople();if(!people.length)return `<div class="share-viewer-empty">Không tìm thấy người phù hợp</div>`;return people.map(person=>`<button class="share-viewer-suggestion" type="button" onclick="selectAdditionalResultViewer('${escapeResultShare(person.id)}')"><strong>${escapeResultShare(person.name)}</strong><span class="domain">(${escapeResultShare(person.login||person.domain||'')})</span></button>`).join('')}
function resultShareChipHTML(){return RESULT_SHARE_STATE.additionalViewerNames.map((name,index)=>{const person=(window.PMS_EMPLOYEES||[]).find(item=>item.name===name),ini=person&&person.ini||name.split(/\s+/).map(word=>word[0]).slice(-2).join('').toUpperCase();return `<span class="share-viewer-chip"><span class="share-viewer-avatar">${escapeResultShare(ini)}</span><span>${escapeResultShare(name)}</span><button type="button" aria-label="Xóa ${escapeResultShare(name)}" onclick="removeAdditionalResultViewer(${index})">×</button></span>`;}).join('')}
function renderResultShareSettings(){const settings=document.getElementById('shareResultSettings'),state=RESULT_SHARE_STATE,options=[['recipient_and_managers','Người nhận phản hồi và các cấp quản lý của họ'],['managers_only','Chỉ các cấp quản lý của người nhận'],['specific_people','Người cụ thể']];settings.innerHTML=`${shareScopeSectionHTML()}<section class="share-section"><span class="share-section-label">Chia sẻ đến ai?</span><div class="share-audience-options">${options.map(([value,title])=>`<label class="share-audience-option ${state.audience===value?'on':''}"><input type="radio" name="resultShareAudience" ${state.audience===value?'checked':''} onchange="setResultShareAudience('${value}')"/><strong>${title}</strong></label>`).join('')}</div></section><section class="share-section share-extra-viewers ${state.audience==='specific_people'?'':'hidden'}"><div class="share-viewer-chips">${resultShareChipHTML()}</div><div class="share-people-picker"><input class="share-viewer-input" id="additionalResultViewerInput" value="${escapeResultShare(state.personQuery)}" placeholder="Tìm theo tên hoặc domain..." oninput="filterResultSharePeople()" onfocus="filterResultSharePeople()" onkeydown="if(event.key==='Escape'){hideResultSharePeople()}"/><div class="share-viewer-suggestions" id="shareResultViewerSuggestions">${resultShareSuggestionHTML()}</div></div></section><section class="share-section"><span class="share-section-label">Nội dung chia sẻ</span><div class="share-audience-options"><label class="share-audience-option ${state.contentLevel==='summary'?'on':''}"><input type="radio" name="resultShareContent" ${state.contentLevel==='summary'?'checked':''} onchange="setResultShareContent('summary')"/><strong>Chỉ tổng hợp AI</strong><small>Điểm mạnh và cơ hội phát triển (AI summary).</small></label><label class="share-audience-option ${state.contentLevel==='summary_detail'?'on':''}"><input type="radio" name="resultShareContent" ${state.contentLevel==='summary_detail'?'checked':''} onchange="setResultShareContent('summary_detail')"/><strong>Tổng hợp AI kèm chi tiết phản hồi</strong><small>Hiển thị toàn bộ phản hồi theo từng câu hỏi.</small></label></div></section><section class="share-section"><span class="share-section-label">Ghi chú của HR <span class="share-optional">(tuỳ chọn)</span></span><textarea class="share-note-input" id="resultShareNote" rows="2" placeholder="Lời nhắn kèm theo khi chia sẻ kết quả..." oninput="setResultShareNote(this.value)">${escapeResultShare(state.note)}</textarea></section><section class="share-section"><div class="share-info-box"><i class="bx bx-info-circle"></i><div><div class="share-info-title">Thông tin người cho phản hồi</div><p>${resultIdentityCopy()}</p></div></div></section>`;const cb=document.getElementById('resultDialogConfirm');if(cb)cb.textContent=shareWillClose()?'Đóng & chia sẻ kết quả':'Chia sẻ kết quả';}
function setResultShareAudience(audience){RESULT_SHARE_STATE.audience=audience;renderResultShareSettings();}
function setResultShareContent(level){RESULT_SHARE_STATE.contentLevel=level;renderResultShareSettings();}
function setResultShareNote(value){RESULT_SHARE_STATE.note=value;}
function filterResultSharePeople(){const input=document.getElementById('additionalResultViewerInput'),menu=document.getElementById('shareResultViewerSuggestions');if(!input||!menu)return;RESULT_SHARE_STATE.personQuery=input.value;menu.innerHTML=resultShareSuggestionHTML();}
function hideResultSharePeople(){const menu=document.getElementById('shareResultViewerSuggestions');if(menu)menu.innerHTML='';}
function selectAdditionalResultViewer(personId){const person=(window.PMS_EMPLOYEES||[]).find(item=>item.id===personId);if(!person)return;if(!RESULT_SHARE_STATE.additionalViewerNames.includes(person.name))RESULT_SHARE_STATE.additionalViewerNames.push(person.name);RESULT_SHARE_STATE.personQuery='';renderResultShareSettings();}
function removeAdditionalResultViewer(index){RESULT_SHARE_STATE.additionalViewerNames.splice(index,1);renderResultShareSettings();}
function openResultDialog(title,copy,confirmText,handler){PENDING_DIALOG=handler;const staleCancel=document.getElementById('resultDialogCancel');if(staleCancel)staleCancel.remove();document.getElementById('resultDialogTitle').textContent=title;document.getElementById('resultDialogCopy').textContent=copy;document.getElementById('shareResultSettings').innerHTML='';document.getElementById('resultDialogSurface').classList.remove('share-dialog');const confirm=document.getElementById('resultDialogConfirm');confirm.className='btn btn-outline';confirm.textContent=confirmText;confirm.onclick=()=>{const action=PENDING_DIALOG;if(!action||action()!==false)closeResultDialog();};document.getElementById('resultDialog').classList.add('open');}
function anyShareable(){return DETAIL.participants.some(participant=>isRecipientClosed(participant));}
function shareableRecipients(){return DETAIL.participants.filter(participant=>!FeedbackProgramModel.isResultShared(PROGRAM,participant.employee.id));}
function closeRecipientsQuietly(ids){DETAIL.participants.forEach(participant=>{if(ids.includes(participant.employee.id)){participant.assignments=(participant.assignments||[]).map(assignment=>assignment.status==='pending'?{...assignment,status:'locked'}:assignment);participant.closed=true;participant.closedAt=TODAY;}});if(DETAIL.participants.length&&DETAIL.participants.every(participant=>isRecipientClosed(participant)))PROGRAM=FeedbackProgramModel.closeCampaign(PROGRAM,TODAY);persistProgramState();}
function shareWillClose(){if(RESULT_SHARE_STATE.scope!=='all')return false;if(RESULT_SHARE_STATE.scopeMode==='all')return (DETAIL.participants||[]).some(participant=>!isRecipientClosed(participant));return RESULT_SHARE_STATE.recipientIds.some(id=>!isRecipientClosed(DETAIL.participants.find(participant=>participant.employee.id===id)));}
function openShareFlow(){requestResultShare('all');}
function promptCloseBeforeShare(){openResultDialog('Cần đóng yêu cầu trước khi chia sẻ','Bạn có muốn đóng yêu cầu ngay bây giờ không?','Đóng yêu cầu',()=>{requestTicketClosure();SHARE_AFTER_CLOSE=true;return false;});const confirm=document.getElementById('resultDialogConfirm');confirm.className='btn btn-primary';const cancel=document.createElement('button');cancel.id='resultDialogCancel';cancel.type='button';cancel.className='btn btn-outline';cancel.textContent='Hủy';cancel.onclick=closeResultDialog;confirm.parentNode.insertBefore(cancel,confirm);}
function requestResultShare(scope){const all=scope==='all';if(!all){const target=DETAIL.participants.find(item=>item.employee.id===scope);if(!isRecipientClosed(target)){toast('Chỉ chia sẻ sau khi đóng yêu cầu của người nhận này.');return;}}RESULT_SHARE_STATE={scope,scopeMode:all?'all':'single',recipientIds:[],audience:'',additionalViewerNames:[],personQuery:'',contentLevel:'summary_detail',note:''};openResultDialog('Chia sẻ kết quả','Chọn phạm vi và người có thể xem kết quả phản hồi.','Chia sẻ kết quả',()=>{if(!RESULT_SHARE_STATE.audience){toast('Chọn người có thể xem kết quả.');return false;}if(RESULT_SHARE_STATE.audience==='specific_people'&&!RESULT_SHARE_STATE.additionalViewerNames.length){toast('Chọn ít nhất một người được chia sẻ.');return false;}let shareIds,closeIds;if(all){if(RESULT_SHARE_STATE.scopeMode==='all'){shareIds=[];closeIds=DETAIL.participants.filter(p=>!isRecipientClosed(p)).map(p=>p.employee.id);}else{if(!RESULT_SHARE_STATE.recipientIds.length){toast('Chọn ít nhất một người nhận để chia sẻ.');return false;}shareIds=RESULT_SHARE_STATE.recipientIds.slice();closeIds=shareIds.filter(id=>!isRecipientClosed(DETAIL.participants.find(p=>p.employee.id===id)));}}else{shareIds=[scope];closeIds=isRecipientClosed(DETAIL.participants.find(p=>p.employee.id===scope))?[]:[scope];}if(closeIds.length)closeRecipientsQuietly(closeIds);confirmResultShare(shareIds,{audience:RESULT_SHARE_STATE.audience,additionalViewerNames:RESULT_SHARE_STATE.additionalViewerNames,contentLevel:RESULT_SHARE_STATE.contentLevel,note:RESULT_SHARE_STATE.note});});document.getElementById('resultDialogSurface').classList.add('share-dialog');document.getElementById('resultDialogConfirm').className='btn btn-primary btn-share';renderResultShareSettings();}
function setShareScopeMode(mode){RESULT_SHARE_STATE.scopeMode=mode;renderResultShareSettings();}
function toggleShareRecipient(id){const index=RESULT_SHARE_STATE.recipientIds.indexOf(id);if(index>=0)RESULT_SHARE_STATE.recipientIds.splice(index,1);else RESULT_SHARE_STATE.recipientIds.push(id);renderResultShareSettings();}
function shareScopeSectionHTML(){if(RESULT_SHARE_STATE.scope!=='all')return '';const some=RESULT_SHARE_STATE.scopeMode==='some',list=shareableRecipients();const openInList=list.filter(item=>!isRecipientClosed(item)).length,notice=openInList>0?`<div class="share-notice"><i class="bx bx-error-circle"></i><span>Các yêu cầu chưa đóng sẽ tự động đóng lại (ngừng thu thập phản hồi) sau khi chọn chia sẻ kết quả. Các yêu cầu này sẽ không thể mở lại.</span></div>`:'';const rows=list.map(participant=>{const person=participant.employee,on=RESULT_SHARE_STATE.recipientIds.includes(person.id),closed=isRecipientClosed(participant);return `<label class="close-recipient${on?' on':''}"><input type="checkbox" ${on?'checked':''} onchange="toggleShareRecipient('${person.id}')"/><span class="avatar">${initials(person)}</span><span class="cr-info"><span class="cr-name">${person.name}<span class="domain">(${person.domain})</span></span><span class="cr-meta${closed?'':' cr-meta-open'}">${closed?'Đã đóng':'Chưa đóng - sẽ đóng khi chia sẻ'}</span></span></label>`;}).join('');const listBlock=list.length?`<div class="close-recipient-list">${rows}</div>`:`<div class="close-empty">Tất cả kết quả đã được chia sẻ.</div>`;return `${notice}<section class="share-section"><span class="share-section-label">Phạm vi chia sẻ</span><div class="share-audience-options"><label class="share-audience-option${!some?' on':''}"><input type="radio" name="shareScope" ${!some?'checked':''} onchange="setShareScopeMode('all')"/><span><strong>Chia sẻ toàn bộ kết quả</strong><small>Chia sẻ kết quả của tất cả người nhận; ticket chưa đóng sẽ được đóng nốt.</small></span></label><label class="share-audience-option${some?' on':''}"><input type="radio" name="shareScope" ${some?'checked':''} onchange="setShareScopeMode('some')"/><span><strong>Chia sẻ theo người nhận</strong><small>Chọn một hoặc một số người nhận để chia sẻ.</small></span></label></div></section><section class="share-section share-recipient-section${some?'':' hidden'}"><span class="share-section-label">Chọn người nhận cần chia sẻ</span>${listBlock}</section>`;}
function confirmResultShare(participantIds,options){const existing=PROGRAM.resultSharing||{};let ids=participantIds;if(participantIds.length&&existing.mode==='shared_selected'){ids=[...new Set([...(existing.participantIds||[]),...participantIds])];}PROGRAM=FeedbackProgramModel.shareResults(PROGRAM,ids,TODAY,options);persistProgramState();renderDetail();toast('Đã chia sẻ kết quả.');}
function sharingSummary(){const sharing=PROGRAM.resultSharing||{},extras=(sharing.additionalViewerNames||[]).length?` và ${sharing.additionalViewerNames.length} người cụ thể`:'';const fullyShared=sharing.mode==='shared_all'||((DETAIL.participants||[]).length>0&&DETAIL.participants.every(p=>FeedbackProgramModel.isResultShared(PROGRAM,p.employee.id)));const shareBtn=fullyShared?'':'<button class="btn btn-outline-brand btn-share" type="button" onclick="openShareFlow()">Chia sẻ kết quả</button>';if(sharing.mode==='not_shared')return {label:'',meta:'',action:shareBtn};const content=sharing.contentLevel==='summary'?'Chỉ tổng hợp AI':'Tổng hợp AI kèm chi tiết';return {label:'<span class="share-status-done">Đã chia sẻ kết quả</span>',meta:`<ul class="share-meta-list"><li>Thời gian: ${sharing.sharedAt||'—'}</li><li>Chia sẻ đến: ${audienceCopy(sharing.audience)}${extras}</li><li>Nội dung: ${content}</li></ul>`,action:shareBtn};}
function overviewStatus(){const dt=FeedbackProgramModel.daysBetween,age=dt(TODAY,PROGRAM.createdAt);if(age!==null&&age>90)return{state:'closed',label:'Đã đóng',icon:'bx-lock-alt'};const assignments=(DETAIL.participants||[]).flatMap(item=>item.assignments||[]),responded=assignments.filter(item=>item.status==='submitted').length;if(assignments.length>0&&responded>=assignments.length)return{state:'complete',label:'Hoàn thành',icon:'bx-check-circle'};const overdue=dt(TODAY,PROGRAM.due);if(overdue!==null&&overdue>0)return{state:'overdue',label:'Quá hạn',icon:'bx-error-circle'};const left=dt(PROGRAM.due,TODAY);if(left!==null&&left>=0&&left<=3)return{state:'due_soon',label:'Sắp đến hạn',icon:'bx-time-five'};return{state:'collecting',label:'Đang thu thập',icon:'bx-loader-circle'};}
function renderProgramOverview(){const data=FeedbackProgramModel.programDetailOverview(DETAIL,TODAY),eligible=DETAIL.participants.flatMap(item=>item.assignments||[]).some(item=>FeedbackProgramModel.canRemindProgramAssignment(PROGRAM,item,NOW)),percent=data.totalResponses?Math.round(data.responded/data.totalResponses*100):0,status=overviewStatus(),closed=PROGRAM.status==='closed',sharing=sharingSummary();document.getElementById('overview').innerHTML=`<div class="summary-title">Tổng quan chương trình</div><div class="summary-status summary-status-${status.state}"><i class="bx ${status.icon}"></i>${status.label}</div><div class="summary-progress"><div class="summary-progress-head"><span>Tiến độ phản hồi</span><strong>${data.responded}/${data.totalResponses} đã trả lời</strong></div><div class="summary-progress-track"><span class="summary-progress-fill" style="width:${percent}%"></span></div></div><div class="summary-list"><div class="summary-row"><span>Ngày tạo</span><strong>${PROGRAM.createdAt}</strong></div><div class="summary-row"><span>Hạn phản hồi</span><strong>${PROGRAM.due}</strong></div><div class="summary-row"><span>Nhân viên nhận phản hồi</span><strong>${data.participants}</strong></div><div class="summary-row"><span>Người cho phản hồi</span><strong>${data.reviewers}</strong></div><div class="summary-row"><span>Phản hồi đang chờ</span><strong>${data.pending}</strong></div><div class="summary-row"><span>Thông tin người cho phản hồi</span><strong>${PROGRAM.identityVisibility==='anonymous'?'Ẩn danh':'Hiện danh tính'}</strong></div></div><section class="summary-share">${sharing.label||sharing.meta?`<div><div class="summary-share-status">${sharing.label}</div>${sharing.meta?`<div class="summary-share-meta">${sharing.meta}</div>`:''}</div>`:''}${sharing.action?`<div class="summary-share-action">${sharing.action}</div>`:''}</section>${data.pending&&!closed&&!isAnon()?`<button class="btn btn-remind summary-remind-all" onclick="sendEligibleReminders()" ${eligible?'':'disabled'}><i class="bx bx-bell"></i> Nhắc toàn bộ người chưa trả lời</button>`:''}`;}
renderDetail();
</script>

<script>/* Kéo đổi độ rộng cột danh sách (rail trái) — chỉ lấy width từ panel giữa, panel phải giữ nguyên */
(function(){
  const shell=document.querySelector('.shell.request-detail-layout'),handle=document.getElementById('railResizer');
  if(!shell||!handle)return;
  const MIN=240,MAX=360,KEY='uc5_h06_rail_w';
  const clamp=v=>Math.min(MAX,Math.max(MIN,v));
  const curW=()=>parseInt(getComputedStyle(shell).getPropertyValue('--rail-w'),10)||MIN;
  const setW=w=>shell.style.setProperty('--rail-w',clamp(w)+'px');
  const saved=parseInt(localStorage.getItem(KEY),10);
  if(saved>=MIN&&saved<=MAX)setW(saved);
  let startX=0,startW=0,dragging=false;
  handle.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startW=curW();try{handle.setPointerCapture(e.pointerId)}catch(_){}document.body.style.userSelect='none';e.preventDefault();});
  handle.addEventListener('pointermove',e=>{if(dragging)setW(startW+(e.clientX-startX));});
  const end=e=>{if(!dragging)return;dragging=false;document.body.style.userSelect='';localStorage.setItem(KEY,curW());try{handle.releasePointerCapture(e.pointerId)}catch(_){}};
  handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);
  handle.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){setW(curW()-12);localStorage.setItem(KEY,curW());e.preventDefault();}else if(e.key==='ArrowRight'){setW(curW()+12);localStorage.setItem(KEY,curW());e.preventDefault();}});
  handle.addEventListener('dblclick',()=>{setW(MIN);localStorage.setItem(KEY,MIN);});
})();
</script>
